<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aviation Technical English · 背單字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1218;
    --panel:#161d26;
    --panel-2:#1d2530;
    --border:#2a3442;
    --border-soft:#212a35;
    --text:#e9edf3;
    --text-dim:#8b96a5;
    --text-faint:#5b6573;
    --amber:#ffb020;
    --amber-dim:#8a5c14;
    --amber-glow:rgba(255,176,32,0.14);
    --green:#3ddc97;
    --green-dim:rgba(61,220,151,0.14);
    --red:#ff6161;
    --red-dim:rgba(255,97,97,0.14);
    --blue:#5cc2f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:18px 16px 48px;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* top placard */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .menu-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:9px;width:36px;height:36px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .menu-btn:active{transform:scale(0.94);}
  .brand-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    flex:none;
  }
  .brand-text h1{
    margin:0;font-size:15px;font-weight:700;letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .brand-text p{
    margin:2px 0 0;font-size:11px;color:var(--text-dim);letter-spacing:0.04em;
  }

  /* menu / reset-week / test-select modal content */
  .menu-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .menu-item{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:14px;text-align:left;color:var(--text);cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .menu-item:active{transform:scale(0.98);}
  .menu-item .mi-title{font-weight:600;font-size:14px;margin-bottom:3px;}
  .menu-item .mi-sub{font-size:11.5px;color:var(--text-dim);}

  .select-all-row{
    display:flex;align-items:center;gap:8px;padding:2px 2px 12px;
    font-size:12.5px;color:var(--text-dim);
  }
  .select-all-row input{accent-color:var(--amber);width:16px;height:16px;}

  .week-check-list{
    display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
    max-height:320px;overflow-y:auto;
  }
  .week-check-row{
    display:flex;align-items:center;gap:10px;background:var(--panel-2);
    border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;
  }
  .week-check-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--amber);flex:none;}
  .week-check-row label{font-size:12.5px;flex:1;color:var(--text);}
  .week-check-row .wc-count{font-size:10.5px;color:var(--text-dim);white-space:nowrap;}

  .test-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;}
  .test-item{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:13px 14px;text-align:left;cursor:pointer;color:var(--text);
    font-family:'Inter',sans-serif;
  }
  .test-item:active{transform:scale(0.98);}
  .test-item .ti-title{font-weight:600;font-size:14px;}
  .test-item .ti-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;}

  .mode-label{
    font-size:11px;color:var(--amber);letter-spacing:0.03em;
    text-align:center;margin-bottom:8px;
  }

  /* overall status strip */
  .status-strip{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:1px;background:var(--border-soft);
    border:1px solid var(--border-soft);
    border-radius:10px;overflow:hidden;
    margin-bottom:20px;
  }
  .status-cell{
    background:var(--panel);
    padding:10px 8px;text-align:center;
  }
  .status-cell .num{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;font-weight:700;color:var(--amber);
    line-height:1.1;
  }
  .status-cell .lbl{
    font-size:10px;color:var(--text-dim);
    margin-top:3px;letter-spacing:0.03em;
  }
  .status-cell.green .num{color:var(--green);}
  .status-cell.blue .num{color:var(--blue);}

  .fuelbar-outer{
    height:6px;border-radius:4px;background:var(--panel-2);
    border:1px solid var(--border-soft);overflow:hidden;margin-bottom:26px;
  }
  .fuelbar-inner{
    height:100%;background:linear-gradient(90deg,var(--amber),var(--green));
    border-radius:4px;transition:width .5s ease;
  }

  h2.section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--text-dim);margin:0 0 12px;
  }

  /* week cards */
  .week-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  .week-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:14px;cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    text-align:left;color:inherit;
  }
  .week-card:active{transform:scale(0.98);}
  .week-card:hover{border-color:var(--amber-dim);}
  .week-card .wk-label{
    font-family:'Space Grotesk',sans-serif;font-size:12px;
    letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;
  }
  .week-card .wk-range{
    font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;
    margin:4px 0 10px;color:var(--text);
  }
  .week-progress-track{
    height:5px;border-radius:3px;background:var(--panel-2);
    border:1px solid var(--border-soft);overflow:hidden;margin-bottom:6px;
  }
  .week-progress-fill{height:100%;background:var(--green);border-radius:3px;}
  .week-card .wk-stat{font-size:11px;color:var(--text-dim);}
  .week-card .wk-stat b{color:var(--text);font-weight:600;}
  .week-card.done{border-color:var(--green-dim);}
  .week-card.done .wk-range{color:var(--green);}

  /* quiz screen */
  .quiz-topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;gap:8px;
  }
  .quiz-topbar-left{display:flex;gap:8px;}
  .save-btn{color:var(--amber);border-color:var(--amber-dim);white-space:nowrap;}
  .back-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .back-btn:active{transform:scale(0.96);}
  .quiz-progress-text{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);
  }
  .quiz-progress-track{
    height:4px;border-radius:3px;background:var(--panel-2);
    overflow:hidden;margin-bottom:20px;
  }
  .quiz-progress-fill{height:100%;background:var(--amber);border-radius:3px;transition:width .3s ease;}

  .card-panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:24px 20px;text-align:center;
    position:relative;
  }
  .star-btn{
    position:absolute;top:12px;right:14px;
    background:none;border:none;font-size:23px;line-height:1;
    color:var(--text-faint);cursor:pointer;padding:4px;
  }
  .star-btn:active{transform:scale(0.9);}
  .star-btn.active{color:var(--amber);}
  .pos-chip{
    display:inline-block;background:var(--amber-glow);color:var(--amber);
    border:1px solid var(--amber-dim);border-radius:20px;
    padding:4px 14px;font-size:12px;font-weight:600;letter-spacing:0.03em;
    margin-bottom:16px;
  }
  .meaning{
    font-size:24px;font-weight:600;line-height:1.4;margin:0 0 6px;
  }
  .letter-count{
    font-size:11px;color:var(--text-faint);margin-bottom:22px;
    font-family:'JetBrains Mono',monospace;letter-spacing:0.05em;
  }
  .hint-row{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:3px;margin-bottom:22px;min-height:34px;align-items:flex-end;
  }
  .ltr-box{
    width:22px;height:30px;border-bottom:2px solid var(--amber-dim);
    display:inline-flex;align-items:flex-end;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;
    color:var(--amber);padding-bottom:3px;
  }
  .sep-space{width:12px;}
  .sep-hyphen{
    align-self:flex-end;color:var(--text-faint);font-size:18px;
    padding-bottom:6px;font-family:'JetBrains Mono',monospace;
  }

  .answer-input{
    width:100%;background:var(--panel-2);border:1.5px solid var(--border);
    border-radius:10px;color:var(--text);font-size:18px;
    padding:12px 14px;text-align:center;font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px;
    outline:none;
  }
  .answer-input:focus{border-color:var(--amber);}
  .answer-input.correct{border-color:var(--green);color:var(--green);}
  .answer-input.wrong{border-color:var(--red);color:var(--red);}

  .err-msg{
    font-size:12px;color:var(--red);margin:-4px 0 12px;min-height:16px;
  }

  .feedback-msg{
    font-size:13px;margin:-2px 0 14px;min-height:18px;font-weight:600;
  }
  .feedback-msg.ok{color:var(--green);}
  .feedback-msg.no{color:var(--red);}

  .btn-primary{
    width:100%;background:var(--amber);color:#241503;border:none;
    border-radius:10px;padding:13px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:0.02em;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    width:100%;background:none;color:var(--text-dim);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-size:14px;cursor:pointer;
    font-family:'Inter',sans-serif;margin-top:10px;
  }

  /* summary screen */
  .summary-panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:32px 20px;text-align:center;
  }
  .summary-panel .big-num{
    font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;
    color:var(--green);margin:6px 0;
  }
  .summary-panel .sub{color:var(--text-dim);font-size:13px;margin-bottom:24px;}

  .wrong-list-wrap{margin-bottom:20px;}
  .wrong-list-wrap .section-title{margin-bottom:10px;}
  .wrong-list{
    display:flex;flex-direction:column;gap:8px;text-align:left;
    max-height:320px;overflow-y:auto;
  }
  .wrong-item{
    background:var(--panel-2);border:1px solid var(--border-soft);
    border-radius:8px;padding:10px 12px;
  }
  .wrong-item .wi-word{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    color:var(--red);font-size:14px;
  }
  .wrong-item .wi-meaning{font-size:12px;color:var(--text-dim);margin-top:2px;}

  .starred-item-row{
    display:flex;align-items:center;gap:10px;
  }
  .starred-item-row .sr-word{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;
    color:var(--text);flex:0 0 auto;
  }
  .starred-item-row .sr-pos{
    font-size:11px;color:var(--amber);flex:0 0 auto;white-space:nowrap;
  }
  .starred-item-row .sr-meaning{
    font-size:12.5px;color:var(--text-dim);flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .star-remove-btn{
    background:none;border:none;color:var(--amber);font-size:21px;
    cursor:pointer;padding:2px 4px;flex:none;line-height:1;
  }
  .star-remove-btn:active{transform:scale(0.9);}
  .star-remove-btn.inactive{color:var(--text-faint);}
  .summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px;}
  .summary-stats div{background:var(--panel-2);border-radius:10px;padding:12px;}
  .summary-stats .n{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
  .summary-stats .l{font-size:11px;color:var(--text-dim);margin-top:3px;}

  /* loading */
  .loading-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70vh;color:var(--text-dim);font-size:13px;gap:10px;
  }
  .spinner{
    width:22px;height:22px;border-radius:50%;
    border:2.5px solid var(--border);border-top-color:var(--amber);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* confirm modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal-box{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:20px;max-width:320px;width:100%;
  }
  .modal-box p{font-size:14px;color:var(--text);margin:0 0 18px;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{
    flex:1;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .modal-actions .cancel{background:none;border:1px solid var(--border);color:var(--text-dim);}
  .modal-actions .confirm{background:var(--red);border:none;color:#2a0a0a;font-weight:700;}

  .hidden{display:none !important;}
  .empty-note{font-size:12px;color:var(--text-faint);text-align:center;padding:20px 0;}

  .storage-status{
    font-size:11.5px;padding:9px 12px;border-radius:8px;margin-bottom:16px;
    border:1px solid var(--border-soft);color:var(--text-dim);background:var(--panel);
    line-height:1.5;
  }
  .storage-status.ok{color:var(--green);border-color:rgba(61,220,151,0.3);}
  .storage-status.warn{color:var(--amber);border-color:rgba(255,176,32,0.35);}
  .storage-status.bad{color:var(--red);border-color:rgba(255,97,97,0.35);}

  .backup-row{display:flex;gap:10px;margin-bottom:8px;}
  .backup-btn{margin-top:0;font-size:12.5px;padding:11px 8px;}
  .backup-note{font-size:11px;color:var(--text-faint);line-height:1.5;padding-bottom:6px;}

  .save-note{font-size:11px;min-height:14px;margin:-8px 0 12px;color:var(--text-faint);}
  .save-note.ok{color:var(--green);}
  .save-note.bad{color:var(--red);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--border);
    padding:11px 18px;border-radius:10px;font-size:13px;
    z-index:100;box-shadow:0 6px 24px rgba(0,0,0,0.5);
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    max-width:85%;text-align:center;
  }
  .toast.show{opacity:1;}
  .toast.ok{color:var(--green);border-color:rgba(61,220,151,0.4);}
  .toast.bad{color:var(--red);border-color:rgba(255,97,97,0.4);}

  @media (max-width:360px){
    .week-grid{gap:10px;}
    .meaning{font-size:21px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <div>系統啟動中…</div>
  </div>

  <div id="mainContent" class="hidden">

    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-text">
          <h1>Aviation Technical English</h1>
          <p>Level 1 · 詞彙訓練系統</p>
        </div>
      </div>
      <button class="menu-btn" id="menuBtn" aria-label="選單">☰</button>
    </div>

    <!-- HOME SCREEN -->
    <div id="homeScreen">
      <div class="storage-status" id="storageStatus">檢查儲存狀態中…</div>

      <div class="status-strip">
        <div class="status-cell">
          <div class="num mono" id="statMastered">0</div>
          <div class="lbl">已熟記</div>
        </div>
        <div class="status-cell green">
          <div class="num mono" id="statTotal">0</div>
          <div class="lbl">單字總數</div>
        </div>
        <div class="status-cell blue">
          <div class="num mono" id="statDays">0</div>
          <div class="lbl">累積練習天數</div>
        </div>
      </div>
      <div class="fuelbar-outer"><div class="fuelbar-inner" id="overallFill" style="width:0%"></div></div>

      <h2 class="section-title">選擇週次</h2>
      <div class="week-grid" id="weekGrid"></div>

      <h2 class="section-title" style="margin-top:24px;">備份與還原</h2>
      <div class="backup-row">
        <button class="btn-secondary backup-btn" id="exportBtn">📤 匯出進度備份</button>
        <button class="btn-secondary backup-btn" id="importBtn">📥 匯入進度備份</button>
        <input type="file" id="importFile" accept="application/json" class="hidden">
      </div>
      <div class="backup-note">建議每次練習完都匯出一份存起來，避免因裝置或瀏覽器限制而遺失進度。匯入時會用備份檔完全覆蓋目前的進度。</div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="hidden">
      <div class="quiz-topbar">
        <div class="quiz-topbar-left">
          <button class="back-btn" id="quizBackBtn">← 返回</button>
          <button class="back-btn save-btn" id="manualSaveBtn">💾 立即儲存</button>
        </div>
        <div class="quiz-progress-text" id="quizProgressText">0 / 0</div>
      </div>
      <div class="quiz-progress-track"><div class="quiz-progress-fill" id="quizProgressFill" style="width:0%"></div></div>
      <div class="mode-label" id="modeLabel"></div>

      <div class="card-panel">
        <button class="star-btn" id="starBtn" aria-label="收藏">☆</button>
        <div class="pos-chip" id="posChip">n</div>
        <div class="meaning" id="meaningText">—</div>
        <div class="hint-row" id="hintRow"></div>

        <input class="answer-input" id="answerInput" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="輸入英文單字">
        <div class="err-msg" id="errMsg"></div>
        <div class="feedback-msg" id="feedbackMsg"></div>
        <div class="save-note" id="saveNote"></div>

        <button class="btn-primary" id="actionBtn">檢查答案</button>
      </div>
    </div>

    <!-- SUMMARY SCREEN -->
    <div id="summaryScreen" class="hidden">
      <div class="summary-panel">
        <div class="sub" id="summaryTitle">本次練習完成</div>
        <div class="big-num" id="summaryAccuracy">0%</div>
        <div class="sub">答對率</div>
        <div class="summary-stats">
          <div><div class="n mono" id="summaryCorrect">0</div><div class="l">答對題數</div></div>
          <div id="masteredStatBox"><div class="n mono" id="summaryNewMastered">0</div><div class="l">新增熟記</div></div>
        </div>

        <div class="wrong-list-wrap hidden" id="wrongListWrap">
          <h2 class="section-title" style="text-align:left;">答錯的單字</h2>
          <div class="wrong-list" id="wrongList"></div>
        </div>

        <button class="btn-primary" id="summaryHomeBtn">返回首頁</button>
        <button class="btn-secondary" id="summaryAgainBtn">再練一次</button>
      </div>
    </div>

    <!-- STARRED WORDS SCREEN -->
    <div id="starredScreen" class="hidden">
      <div class="quiz-topbar">
        <button class="back-btn" id="starredBackBtn">← 返回</button>
        <div class="quiz-progress-text" id="starredWeekLabel"></div>
      </div>
      <div id="starredListWrap"></div>
    </div>

  </div>

  <div class="modal-overlay hidden" id="menuModal">
    <div class="modal-box">
      <div class="menu-list">
        <button class="menu-item" id="menuResetBtn">
          <div class="mi-title">🔄 重設進度</div>
          <div class="mi-sub">選擇要清除熟記紀錄的週次</div>
        </button>
        <button class="menu-item" id="menuStarredBtn">
          <div class="mi-title">⭐️ 難字收藏</div>

const STORAGE_KEY = 'aviation-vocab-progress-v1';

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function hasCloudStorage(){
  return typeof window !== 'undefined' && !!window.storage &&
    typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}

let storageMode = 'none'; // 'cloud' | 'local' | 'none'

async function testCloudStorage(){
  if(!hasCloudStorage()) return false;
  try{
    const testKey = STORAGE_KEY + '-selftest';
    await window.storage.set(testKey, '1');
    const r = await window.storage.get(testKey);
    return !!(r && r.value === '1');
  }catch(e){ return false; }
}

function testLocalStorage(){
  try{
    const k = '__selftest__' + Date.now();
    localStorage.setItem(k, '1');
    const ok = localStorage.getItem(k) === '1';
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}

async function detectStorageMode(){
  if(await testCloudStorage()){ storageMode = 'cloud'; return; }
  if(testLocalStorage()){ storageMode = 'local'; return; }
  storageMode = 'none';
}

function renderStorageStatus(){
  const el = document.getElementById('storageStatus');
  if(!el) return;
  if(storageMode === 'cloud'){
    el.textContent = '✅ 已連接 Claude 雲端儲存，進度會自動保存。';
    el.className = 'storage-status ok';
  } else if(storageMode === 'local'){
    el.textContent = '✅ 已啟用瀏覽器本機儲存，進度會保存在「這個瀏覽器 + 這個檔案位置」。換瀏覽器、無痕模式或搬移檔案位置，進度不會延續，建議定期用下方「匯出進度」備份。';
    el.className = 'storage-status warn';
  } else {
    el.textContent = '⚠️ 偵測不到可用的儲存空間，目前的環境無法自動保存進度（可能是在封閉的檔案預覽器中開啟）。請改用手機或電腦上的瀏覽器（如 Safari、Chrome）直接開啟此檔案；每次練習完也請務必用下方「匯出進度」手動備份。';
    el.className = 'storage-status bad';
  }
}

async function loadProgress(){
  // Preferred: Claude's in-chat persistent storage (works when viewed inside Claude)
  if(hasCloudStorage()){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && typeof parsed === 'object'){
          return { words: parsed.words || {}, days: parsed.days || [], starred: parsed.starred || {} };
        }
      }
    }catch(e){}
  }
  // Fallback: browser localStorage (works when the file is downloaded and opened directly)
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        return { words: parsed.words || {}, days: parsed.days || [], starred: parsed.starred || {} };
      }
    }
  }catch(e){}
  return { words:{}, days:[], starred:{} };
}

async function doSave(){
  let ok = false;
  const json = JSON.stringify(progress);
  if(hasCloudStorage()){
    try{ await window.storage.set(STORAGE_KEY, json); ok = true; }catch(e){}
  }
  try{ localStorage.setItem(STORAGE_KEY, json); ok = true; }catch(e){}
  return ok;
}

function markToday(){
  const t = todayStr();
  if(!progress.days.includes(t)){
    progress.days.push(t);
  }
}

async function recordAnswer(seq, correct){
  markToday();
  const w = progress.words[seq] || { c:0, w:0, m:false };
  const wasMastered = w.m;
  if(correct){
    w.c += 1;
    if(w.c >= 1) w.m = true;
  } else {
    w.w += 1;
    w.c = 0;
  }
  progress.words[seq] = w;
  const saved = await doSave();
  return { newlyMastered: (!wasMastered && w.m), saved };
}

function isMastered(seq){
  return !!(progress.words[seq] && progress.words[seq].m);
}

function isStarred(seq){
  return !!(progress.starred && progress.starred[seq]);
}

async function toggleStar(seq){
  if(!progress.starred) progress.starred = {};
  if(progress.starred[seq]){
    delete progress.starred[seq];
  } else {
    progress.starred[seq] = true;
  }
  await doSave();
}

function weekMasteredCount(weekIdx){
  return WEEKS[weekIdx].filter(v => isMastered(v.s)).length;
}

function totalMasteredCount(){
  let n = 0;
  for(const v of VOCAB) if(isMastered(v.s)) n++;
  return n;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildHintCells(word){
  let shown = false;
  const cells = [];
  for(const ch of word){
    if(/[A-Za-z]/.test(ch)){
      if(!shown){
        cells.push({type:'letter', show:true, ch: ch.toLowerCase()});
        shown = true;
      } else {
        cells.push({type:'letter', show:false, ch:''});
      }
    } else if(ch === ' '){
      cells.push({type:'space'});
    } else {
      cells.push({type:'punct', ch: ch});
    }
  }
  return cells;
}

function normalizeAnswer(s){
  return s.trim().toUpperCase().replace(/\s+/g, ' ');
}

// ---------- RENDER: HOME ----------
function renderHome(){
  document.getElementById('statMastered').textContent = totalMasteredCount();
  document.getElementById('statTotal').textContent = VOCAB.length;
  document.getElementById('statDays').textContent = progress.days.length;
  const pct = VOCAB.length ? Math.round(totalMasteredCount() / VOCAB.length * 100) : 0;
  document.getElementById('overallFill').style.width = pct + '%';

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  WEEKS.forEach((week, idx) => {
    const start = week[0].s, end = week[week.length-1].s;
    const mastered = weekMasteredCount(idx);
    const total = week.length;
    const pct = total ? Math.round(mastered/total*100) : 0;
    const done = mastered === total;

    const card = document.createElement('button');
    card.className = 'week-card' + (done ? ' done' : '');
    card.innerHTML = `
      <div class="wk-label">第 ${idx+1} 週</div>
      <div class="wk-range">${start}–${end}</div>
      <div class="week-progress-track"><div class="week-progress-fill" style="width:${pct}%"></div></div>
      <div class="wk-stat"><b>${mastered}</b> / ${total} 已熟記</div>
    `;
    card.addEventListener('click', () => startWeek(idx));
    grid.appendChild(card);
  });
}

// ---------- QUIZ ----------
function startWeek(idx){
  currentWeekIdx = idx;
  isTestMode = false;
  testWeekLabel = '';
  const week = WEEKS[idx];
  let unmastered = week.filter(v => !isMastered(v.s));
  if(unmastered.length === 0){
    sessionQueue = shuffle(week);
  } else {
    sessionQueue = shuffle(unmastered);
  }
  sessionIdx = 0;
  sessionCorrect = 0;
  sessionNewMastered = 0;
  sessionWrongWords = [];
  showScreen('quiz');
  renderQuestion();
}

function buildWeekTestQueue(weekIdx){
  let queue = [];
  if(weekIdx === 0){
    const n = Math.min(100, WEEKS[0].length);
    queue = shuffle(WEEKS[0]).slice(0, n);
  } else {
    let prevPool = [];
    for(let i=0;i<weekIdx;i++){
      prevPool = prevPool.concat(WEEKS[i]);
    }
    const nPrev = Math.min(18, prevPool.length);
    queue = queue.concat(shuffle(prevPool).slice(0, nPrev));

    const curPool = WEEKS[weekIdx];
    const nCur = Math.min(60, curPool.length);
    queue = queue.concat(shuffle(curPool).slice(0, nCur));
  }
  return shuffle(queue);
}

function startWeekTest(idx){
  currentWeekIdx = idx;
  isTestMode = true;
  testWeekLabel = '第 ' + (idx+1) + ' 週測驗';
  sessionQueue = buildWeekTestQueue(idx);
  sessionIdx = 0;
  sessionCorrect = 0;
  sessionNewMastered = 0;
  sessionWrongWords = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const item = sessionQueue[sessionIdx];
  document.getElementById('modeLabel').textContent = isTestMode ? testWeekLabel : ('第 ' + (currentWeekIdx+1) + ' 週練習');
  document.getElementById('quizProgressText').textContent = (sessionIdx+1) + ' / ' + sessionQueue.length;
  document.getElementById('quizProgressFill').style.width = Math.round((sessionIdx)/sessionQueue.length*100) + '%';
  document.getElementById('posChip').textContent = POS_LABEL[item.p] || item.p;
  document.getElementById('meaningText').textContent = item.c;

  const starBtn = document.getElementById('starBtn');
  if(isTestMode){
    starBtn.classList.add('hidden');
  } else {
    starBtn.classList.remove('hidden');
    starBtn.textContent = isStarred(item.s) ? '★' : '☆';
    starBtn.classList.toggle('active', isStarred(item.s));
  }

  const hintRow = document.getElementById('hintRow');
  hintRow.innerHTML = '';
  const firstLetterMatch = item.w.match(/[A-Za-z]/);
  const firstLetter = firstLetterMatch ? firstLetterMatch[0].toLowerCase() : '';
  const span = document.createElement('span');
  span.className = 'ltr-box';
  span.textContent = firstLetter;
  hintRow.appendChild(span);

  const input = document.getElementById('answerInput');
  input.value = '';
  input.classList.remove('correct','wrong');
  document.getElementById('errMsg').textContent = '';
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  document.getElementById('saveNote').textContent = '';
  document.getElementById('saveNote').className = 'save-note';
  document.getElementById('actionBtn').textContent = '檢查答案';
  input.focus();
}

async function checkAnswer(){
  const input = document.getElementById('answerInput');
  const errMsg = document.getElementById('errMsg');
  const val = input.value;
  if(!val.trim()){
    errMsg.textContent = '請先輸入答案';
    return;
  }
  errMsg.textContent = '';

  const item = sessionQueue[sessionIdx];
  const correct = normalizeAnswer(val) === normalizeAnswer(item.w);
  const feedbackEl = document.getElementById('feedbackMsg');

  if(correct){
    input.classList.add('correct');
    feedbackEl.textContent = '答對了！';
    feedbackEl.className = 'feedback-msg ok';
    sessionCorrect++;
  } else {
    input.classList.add('wrong');
    feedbackEl.textContent = '答錯了，正確答案：' + item.w;
    feedbackEl.className = 'feedback-msg no';
    sessionWrongWords.push(item);
  }

  answered = true;
  const saveNote = document.getElementById('saveNote');

  if(isTestMode){
    // Test mode: just score it, don't touch mastery progress.
    saveNote.textContent = '';
    saveNote.className = 'save-note';
  } else {
    document.getElementById('actionBtn').textContent = '儲存中…';
    document.getElementById('actionBtn').disabled = true;

    const result = await recordAnswer(item.s, correct);
    if(result.newlyMastered) sessionNewMastered++;

    saveNote.textContent = result.saved ? '✅ 這一題已儲存' : '⚠️ 這一題儲存失敗';
    saveNote.className = 'save-note ' + (result.saved ? 'ok' : 'bad');
    document.getElementById('actionBtn').disabled = false;
  }

  document.getElementById('actionBtn').textContent = (sessionIdx+1 < sessionQueue.length) ? '下一題' : (isTestMode ? '完成測驗' : '完成本次練習');
}

function nextOrFinish(){
  if(!answered){
    checkAnswer();
    return;
  }
  if(sessionIdx + 1 < sessionQueue.length){
    sessionIdx++;
    renderQuestion();
  } else {
    finishSession();
  }
}

function finishSession(){
  document.getElementById('quizProgressFill').style.width = '100%';
  const total = sessionQueue.length;
  const pct = total ? Math.round(sessionCorrect/total*100) : 0;
  document.getElementById('summaryAccuracy').textContent = pct + '%';
  document.getElementById('summaryCorrect').textContent = sessionCorrect + ' / ' + total;

  const titleEl = document.getElementById('summaryTitle');
  const masteredBox = document.getElementById('masteredStatBox');
  const wrongWrap = document.getElementById('wrongListWrap');

  if(isTestMode){
    titleEl.textContent = testWeekLabel + ' 完成';
    masteredBox.classList.add('hidden');
    if(sessionWrongWords.length > 0){
      wrongWrap.classList.remove('hidden');
      const listEl = document.getElementById('wrongList');
      listEl.innerHTML = '';
      sessionWrongWords.forEach(w => {
        const div = document.createElement('div');
        div.className = 'wrong-item';
        const wordEl = document.createElement('div');
        wordEl.className = 'wi-word';
        wordEl.textContent = w.w;
        const meaningEl = document.createElement('div');
        meaningEl.className = 'wi-meaning';
        meaningEl.textContent = w.c;
        div.appendChild(wordEl);
        div.appendChild(meaningEl);
        listEl.appendChild(div);
      });
    } else {
      wrongWrap.classList.add('hidden');
    }
  } else {
    titleEl.textContent = '本次練習完成';
    masteredBox.classList.remove('hidden');
    document.getElementById('summaryNewMastered').textContent = sessionNewMastered;
    wrongWrap.classList.add('hidden');
  }

  showScreen('summary');
}

// ---------- SCREEN SWITCH ----------
function showScreen(name){
  document.getElementById('homeScreen').classList.toggle('hidden', name !== 'home');
  document.getElementById('quizScreen').classList.toggle('hidden', name !== 'quiz');
  document.getElementById('summaryScreen').classList.toggle('hidden', name !== 'summary');
  document.getElementById('starredScreen').classList.toggle('hidden', name !== 'starred');
  if(name === 'home') renderHome();
}

// ---------- EVENTS ----------
let toastTimer = null;
function showToast(msg, type){
  let el = document.getElementById('toastEl');
  if(!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2500);
}

document.getElementById('quizBackBtn').addEventListener('click', () => showScreen('home'));
document.getElementById('starBtn').addEventListener('click', async () => {
  const item = sessionQueue[sessionIdx];
  if(!item) return;
  await toggleStar(item.s);
  const starBtn = document.getElementById('starBtn');
  starBtn.textContent = isStarred(item.s) ? '★' : '☆';
  starBtn.classList.toggle('active', isStarred(item.s));
});
document.getElementById('manualSaveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('manualSaveBtn');
  const originalLabel = btn.textContent;
  btn.disabled = true;
  btn.textContent = '儲存中…';
  await detectStorageMode();
  const ok = await doSave();
  renderStorageStatus();
  showToast(
    ok ? '✅ 目前進度已手動儲存成功' : '⚠️ 儲存失敗，這個環境無法保存，請改用瀏覽器開啟此檔案，或用「匯出進度」備份',
    ok ? 'ok' : 'bad'
  );
  btn.disabled = false;
  btn.textContent = originalLabel;
});
document.getElementById('actionBtn').addEventListener('click', nextOrFinish);
document.getElementById('answerInput').addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    e.preventDefault();
    nextOrFinish();
  }
});
document.getElementById('answerInput').addEventListener('input', () => {
  document.getElementById('errMsg').textContent = '';
});
document.getElementById('summaryHomeBtn').addEventListener('click', () => showScreen('home'));
document.getElementById('summaryAgainBtn').addEventListener('click', () => {
  if(isTestMode){ startWeekTest(currentWeekIdx); } else { startWeek(currentWeekIdx); }
});

// ---------- MENU ----------
document.getElementById('menuBtn').addEventListener('click', () => {
  document.getElementById('menuModal').classList.remove('hidden');
});
document.getElementById('menuCloseBtn').addEventListener('click', () => {
  document.getElementById('menuModal').classList.add('hidden');
});
document.getElementById('menuResetBtn').addEventListener('click', () => {
  document.getElementById('menuModal').classList.add('hidden');
  openResetWeekModal();
});
document.getElementById('menuStarredBtn').addEventListener('click', () => {
  document.getElementById('menuModal').classList.add('hidden');
  openStarredWeekModal();
});
document.getElementById('menuTestBtn').addEventListener('click', () => {
  document.getElementById('menuModal').classList.add('hidden');

});

// ---------- RESET BY WEEK ----------
function openResetWeekModal(){
  const list = document.getElementById('resetWeekList');
  list.innerHTML = '';
  WEEKS.forEach((week, idx) => {
    const start = week[0].s, end = week[week.length-1].s;
    const masteredCount = weekMasteredCount(idx);
    const row = document.createElement('div');
    row.className = 'week-check-row';
    row.innerHTML = `
      <input type="checkbox" class="reset-week-cb" data-idx="${idx}" id="resetCb${idx}">
      <label for="resetCb${idx}">第 ${idx+1} 週（${start}–${end}）</label>
      <span class="wc-count">${masteredCount}/${week.length} 已熟記</span>
    `;
    list.appendChild(row);
  });
  document.getElementById('resetSelectAll').checked = false;
  document.getElementById('resetWeekModal').classList.remove('hidden');
}
document.getElementById('resetSelectAll').addEventListener('change', (e) => {
  document.querySelectorAll('.reset-week-cb').forEach(cb => { cb.checked = e.target.checked; });
});
document.getElementById('resetWeekCancelBtn').addEventListener('click', () => {
  document.getElementById('resetWeekModal').classList.add('hidden');
});
document.getElementById('resetWeekConfirmBtn').addEventListener('click', async () => {
  const checkedIdxs = Array.from(document.querySelectorAll('.reset-week-cb'))
    .filter(cb => cb.checked)
    .map(cb => parseInt(cb.dataset.idx, 10));
  if(checkedIdxs.length > 0){
    checkedIdxs.forEach(idx => {
      WEEKS[idx].forEach(item => { delete progress.words[item.s]; });
    });
    await doSave();
  }
  document.getElementById('resetWeekModal').classList.add('hidden');
  showScreen('home');
});

// ---------- WEEK TEST SELECT ----------
function openTestSelectModal(){
  const list = document.getElementById('testList');
  list.innerHTML = '';
  WEEKS.forEach((week, idx) => {
    const start = week[0].s, end = week[week.length-1].s;
    let subtitle;
    if(idx === 0){
      const n = Math.min(100, week.length);
      subtitle = `隨機抽 ${n} 題（範圍 ${start}–${end}）`;
    } else {
      const curN = Math.min(60, week.length);
      subtitle = `第${idx+1}週隨機 ${curN} 題 ＋ 前面所有週次共抽 18 題`;
    }
    const btn = document.createElement('button');
    btn.className = 'test-item';
    btn.innerHTML = `<div class="ti-title">第 ${idx+1} 週測驗</div><div class="ti-sub">${subtitle}</div>`;
    btn.addEventListener('click', () => {
      document.getElementById('testSelectModal').classList.add('hidden');
      startWeekTest(idx);
    });
    list.appendChild(btn);
  });
  document.getElementById('testSelectModal').classList.remove('hidden');
}
document.getElementById('testSelectCloseBtn').addEventListener('click', () => {
  document.getElementById('testSelectModal').classList.add('hidden');
});

// ---------- STARRED WORDS ----------
function openStarredWeekModal(){
  const list = document.getElementById('starredWeekList');
  list.innerHTML = '';
  WEEKS.forEach((week, idx) => {
    const start = week[0].s, end = week[week.length-1].s;
    const count = week.filter(v => isStarred(v.s)).length;
    const btn = document.createElement('button');
    btn.className = 'test-item';
    btn.innerHTML = `<div class="ti-title">第 ${idx+1} 週（${start}–${end}）</div><div class="ti-sub">${count} 個收藏單字</div>`;
    btn.addEventListener('click', () => {
      document.getElementById('starredWeekModal').classList.add('hidden');
      showStarredWeek(idx);
    });
    list.appendChild(btn);
  });
  document.getElementById('starredWeekModal').classList.remove('hidden');
}
document.getElementById('starredWeekCloseBtn').addEventListener('click', () => {
  document.getElementById('starredWeekModal').classList.add('hidden');
});

let pendingUnstar = new Set();

function showStarredWeek(idx){
  const week = WEEKS[idx];
  const starredItems = week.filter(v => isStarred(v.s));
  document.getElementById('starredWeekLabel').textContent = '第 ' + (idx+1) + ' 週收藏';

  pendingUnstar = new Set();

  const wrap = document.getElementById('starredListWrap');
  wrap.innerHTML = '';

  if(starredItems.length === 0){
    const p = document.createElement('div');
    p.className = 'empty-note';
    p.textContent = '尚未收藏單字';
    wrap.appendChild(p);
    showScreen('starred');
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'wrong-list';
  starredItems.forEach(v => {
    const div = document.createElement('div');
    div.className = 'wrong-item';
    const row = document.createElement('div');
    row.className = 'starred-item-row';

    const wordEl = document.createElement('div');
    wordEl.className = 'sr-word';
    wordEl.textContent = v.w;

    const posEl = document.createElement('div');
    posEl.className = 'sr-pos';
    posEl.textContent = v.p;

    const meaningEl = document.createElement('div');
    meaningEl.className = 'sr-meaning';
    meaningEl.textContent = v.c;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'star-remove-btn';
    removeBtn.textContent = '★';
    removeBtn.addEventListener('click', () => {
      if(pendingUnstar.has(v.s)){
        pendingUnstar.delete(v.s);
        removeBtn.textContent = '★';
        removeBtn.classList.remove('inactive');
      } else {
        pendingUnstar.add(v.s);
        removeBtn.textContent = '☆';
        removeBtn.classList.add('inactive');
      }
    });

    row.appendChild(wordEl);
    row.appendChild(posEl);
    row.appendChild(meaningEl);
    row.appendChild(removeBtn);
    div.appendChild(row);
    listEl.appendChild(div);
  });
  wrap.appendChild(listEl);
  showScreen('starred');
}
document.getElementById('starredBackBtn').addEventListener('click', async () => {
  if(pendingUnstar.size > 0){
    pendingUnstar.forEach(seq => {
      if(progress.starred) delete progress.starred[seq];
    });
    await doSave();
    pendingUnstar.clear();
  }
  showScreen('home');
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const payload = {
    app: 'aviation-vocab', version: 1,
    exportedAt: new Date().toISOString(),
    progress: progress
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url;
  a.download = 'vocab-progress-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const parsed = JSON.parse(reader.result);
      const p = parsed && parsed.progress ? parsed.progress : parsed;
      if(!p || typeof p !== 'object' || typeof p.words !== 'object'){
        alert('這個檔案格式看起來不正確，無法匯入。');
        return;
      }
      progress = { words: p.words || {}, days: Array.isArray(p.days) ? p.days : [], starred: p.starred || {} };
      await doSave();
      showScreen('home');
      alert('匯入成功！');
    }catch(err){
      alert('讀取失敗，請確認選的是本App匯出的備份檔。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// ---------- INIT ----------
(async function init(){
  await detectStorageMode();
  progress = await loadProgress();
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  showScreen('home');
  renderStorageStatus();
})();
</script>
