const POS_LABEL = {
  'n':'名詞 · n.', 'v':'動詞 · v.', 'adj':'形容詞 · adj.', 'adv':'副詞 · adv.',
  'prep':'介系詞 · prep.', 'vt':'及物動詞 · vt.', 'adj./v':'形容詞/動詞', '?':'未標示詞性'
};

const WEEK_SIZE = 120;
const WEEKS = [];
for(let i=0;i<VOCAB.length;i+=WEEK_SIZE){
  WEEKS.push(VOCAB.slice(i, i+WEEK_SIZE));
}

let progress = { words:{}, days:[], starred:{}, searchHistory:[] };
let currentWeekIdx = null;
let isTestMode = false;
let testWeekLabel = '';
let sessionQueue = [];
let sessionIdx = 0;
let sessionCorrect = 0;
let sessionNewMastered = 0;
let sessionWrongWords = [];
let isCustomTest = false;
let lastCustomSelections = [];
let answered = false;

const STORAGE_KEY = 'aviation-vocab-progress-v1';

function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function hasCloudStorage(){
  return typeof window !== 'undefined' && !!window.storage &&
    typeof window.storage.get === 'function' && typeof window.storage.set === 'function';
}

let storageMode = 'none'; // 'cloud' | 'local' | 'none'

async function testCloudStorage(){
  if(!hasCloudStorage()) return false;
  try{
    const testKey = STORAGE_KEY + '-selftest';
    await window.storage.set(testKey, '1');
    const r = await window.storage.get(testKey);
    return !!(r && r.value === '1');
  }catch(e){ return false; }
}

function testLocalStorage(){
  try{
    const k = '__selftest__' + Date.now();
    localStorage.setItem(k, '1');
    const ok = localStorage.getItem(k) === '1';
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}

async function detectStorageMode(){
  if(await testCloudStorage()){ storageMode = 'cloud'; return; }
  if(testLocalStorage()){ storageMode = 'local'; return; }
  storageMode = 'none';
}

function renderStorageStatus(){
  const el = document.getElementById('storageStatus');
  if(!el) return;
  if(storageMode === 'cloud'){
    el.textContent = '✅ 已連接 Claude 雲端儲存，進度會自動保存。';
    el.className = 'storage-status ok';
  } else if(storageMode === 'local'){
    el.textContent = '✅ 已啟用瀏覽器本機儲存，進度會保存在「這個瀏覽器 + 這個檔案位置」。換瀏覽器、無痕模式或搬移檔案位置，進度不會延續，建議定期用下方「匯出進度」備份。';
    el.className = 'storage-status warn';
  } else {
    el.textContent = '⚠️ 偵測不到可用的儲存空間，目前的環境無法自動保存進度（可能是在封閉的檔案預覽器中開啟）。請改用手機或電腦上的瀏覽器（如 Safari、Chrome）直接開啟此檔案；每次練習完也請務必用下方「匯出進度」手動備份。';
    el.className = 'storage-status bad';
  }
}

async function loadProgress(){
  // Preferred: Claude's in-chat persistent storage (works when viewed inside Claude)
  if(hasCloudStorage()){
    try{
      const res = await window.storage.get(STORAGE_KEY);
      if(res && res.value){
        const parsed = JSON.parse(res.value);
        if(parsed && typeof parsed === 'object'){
          return { words: parsed.words || {}, days: parsed.days || [], starred: parsed.starred || {}, searchHistory: Array.isArray(parsed.searchHistory) ? parsed.searchHistory : [] };
        }
      }
    }catch(e){}
  }
  // Fallback: browser localStorage (works when the file is downloaded and opened directly)
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      if(parsed && typeof parsed === 'object'){
        return { words: parsed.words || {}, days: parsed.days || [], starred: parsed.starred || {}, searchHistory: Array.isArray(parsed.searchHistory) ? parsed.searchHistory : [] };
      }
    }
  }catch(e){}
  return { words:{}, days:[], starred:{}, searchHistory:[] };
}

async function doSave(){
  let ok = false;
  const json = JSON.stringify(progress);
  if(hasCloudStorage()){
    try{ await window.storage.set(STORAGE_KEY, json); ok = true; }catch(e){}
  }
  try{ localStorage.setItem(STORAGE_KEY, json); ok = true; }catch(e){}
  return ok;
}

function markToday(){
  const t = todayStr();
  if(!progress.days.includes(t)){
    progress.days.push(t);
  }
}

async function recordAnswer(seq, correct){
  markToday();
  const w = progress.words[seq] || { c:0, w:0, m:false };
  const wasMastered = w.m;
  if(correct){
    w.c += 1;
    if(w.c >= 1) w.m = true;
  } else {
    w.w += 1;
    w.c = 0;
  }
  progress.words[seq] = w;
  const saved = await doSave();
  return { newlyMastered: (!wasMastered && w.m), saved };
}

function isMastered(seq){
  return !!(progress.words[seq] && progress.words[seq].m);
}

function isStarred(seq){
  return !!(progress.starred && progress.starred[seq]);
}

async function toggleStar(seq){
  if(!progress.starred) progress.starred = {};
  if(progress.starred[seq]){
    delete progress.starred[seq];
  } else {
    progress.starred[seq] = true;
  }
  await doSave();
}

function weekMasteredCount(weekIdx){
  return WEEKS[weekIdx].filter(v => isMastered(v.s)).length;
}

function totalMasteredCount(){
  let n = 0;
  for(const v of VOCAB) if(isMastered(v.s)) n++;
  return n;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildHintCells(word){
  let shown = false;
  const cells = [];
  for(const ch of word){
    if(/[A-Za-z]/.test(ch)){
      if(!shown){
        cells.push({type:'letter', show:true, ch: ch.toLowerCase()});
        shown = true;
      } else {
        cells.push({type:'letter', show:false, ch:''});
      }
    } else if(ch === ' '){
      cells.push({type:'space'});
    } else {
      cells.push({type:'punct', ch: ch});
    }
  }
  return cells;
}

function normalizeAnswer(s){
  return s.trim().toUpperCase().replace(/\s+/g, ' ');
}

// ---------- RENDER: HOME ----------
function renderHome(){
  document.getElementById('statMastered').textContent = totalMasteredCount();
  document.getElementById('statTotal').textContent = VOCAB.length;
  document.getElementById('statDays').textContent = progress.days.length;
  const pct = VOCAB.length ? Math.round(totalMasteredCount() / VOCAB.length * 100) : 0;
  document.getElementById('overallFill').style.width = pct + '%';

  const grid = document.getElementById('weekGrid');
  grid.innerHTML = '';
  WEEKS.forEach((week, idx) => {
    const start = week[0].s, end = week[week.length-1].s;
    const mastered = weekMasteredCount(idx);
    const total = week.length;
    const pct = total ? Math.round(mastered/total*100) : 0;
    const done = mastered === total;

    const card = document.createElement('button');
    card.className = 'week-card' + (done ? ' done' : '');
    card.innerHTML = `
      <div class="wk-label">第 ${idx+1} 週</div>
      <div class="wk-range">${start}–${end}</div>
      <div class="week-progress-track"><div class="week-progress-fill" style="width:${pct}%"></div></div>
      <div class="wk-stat"><b>${mastered}</b> / ${total} 已熟記</div>
    `;
    card.addEventListener('click', () => startWeek(idx));
    grid.appendChild(card);
  });
}

// ---------- QUIZ ----------
function startWeek(idx){
  currentWeekIdx = idx;
  isTestMode = false;
  isCustomTest = false;
  testWeekLabel = '';
  const week = WEEKS[idx];
  let unmastered = week.filter(v => !isMastered(v.s));
  if(unmastered.length === 0){
    sessionQueue = shuffle(week);
  } else {
    sessionQueue = shuffle(unmastered);
  }
  sessionIdx = 0;
  sessionCorrect = 0;
  sessionNewMastered = 0;
  sessionWrongWords = [];
  showScreen('quiz');
  renderQuestion();
}

function pickWithStarredPriority(pool, n){
  const starred = shuffle(pool.filter(v => isStarred(v.s)));
  const rest = shuffle(pool.filter(v => !isStarred(v.s)));
  let picked = starred.slice(0, n);
  if(picked.length < n){
    picked = picked.concat(rest.slice(0, n - picked.length));
  }
  return picked;
}

function buildWeekTestQueue(weekIdx){
  let queue = [];
  if(weekIdx === 0){
    const n = Math.min(100, WEEKS[0].length);
    queue = pickWithStarredPriority(WEEKS[0], n);
  } else {
    let prevPool = [];
    for(let i=0;i<weekIdx;i++){
      prevPool = prevPool.concat(WEEKS[i]);
    }
    const nPrev = Math.min(18, prevPool.length);
    queue = queue.concat(pickWithStarredPriority(prevPool, nPrev));

    const curPool = WEEKS[weekIdx];
    const nCur = Math.min(60, curPool.length);
    queue = queue.concat(pickWithStarredPriority(curPool, nCur));
  }
  return shuffle(queue);
}

function startWeekTest(idx){
  currentWeekIdx = idx;
  isTestMode = true;
  isCustomTest = false;
  testWeekLabel = '第 ' + (idx+1) + ' 週測驗';
  sessionQueue = buildWeekTestQueue(idx);
  sessionIdx = 0;
  sessionCorrect = 0;
  sessionNewMastered = 0;
  sessionWrongWords = [];
  showScreen('quiz');
  renderQuestion();
}

function buildCustomQueue(selections){
  let queue = [];
  selections.forEach(sel => {
    const n = Math.min(sel.n, WEEKS[sel.idx].length);
    queue = queue.concat(pickWithStarredPriority(WEEKS[sel.idx], n));
  });
  return shuffle(queue);
}

function startCustomTest(selections){
  lastCustomSelections = selections;
  currentWeekIdx = null;
  isTestMode = true;
  isCustomTest = true;
  const labelParts = selections.map(sel => '第' + (sel.idx+1) + '週×' + Math.min(sel.n, WEEKS[sel.idx].length));
  testWeekLabel = '自訂測驗（' + labelParts.join('、') + '）';
  sessionQueue = buildCustomQueue(selections);
  sessionIdx = 0;
  sessionCorrect = 0;
  sessionNewMastered = 0;
  sessionWrongWords = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const item = sessionQueue[sessionIdx];
  document.getElementById('modeLabel').textContent = isTestMode ? testWeekLabel : ('第 ' + (currentWeekIdx+1) + ' 週練習');
  document.getElementById('quizProgressText').textContent = (sessionIdx+1) + ' / ' + sessionQueue.length;
  document.getElementById('quizProgressFill').style.width = Math.round((sessionIdx)/sessionQueue.length*100) + '%';
  document.getElementById('posChip').textContent = POS_LABEL[item.p] || item.p;
  document.getElementById('meaningText').textContent = item.c;

  const starBtn = document.getElementById('starBtn');
  starBtn.classList.remove('hidden');
  starBtn.textContent = isStarred(item.s) ? '★' : '☆';
  starBtn.classList.toggle('active', isStarred(item.s));

  const hintRow = document.getElementById('hintRow');
  hintRow.innerHTML = '';
  const firstLetterMatch = item.w.match(/[A-Za-z]/);
  const firstLetter = firstLetterMatch ? firstLetterMatch[0].toLowerCase() : '';
  const span = document.createElement('span');
  span.className = 'ltr-box';
  span.textContent = firstLetter;
  hintRow.appendChild(span);

  const input = document.getElementById('answerInput');
  input.value = '';
  input.classList.remove('correct','wrong');
  document.getElementById('errMsg').textContent = '';
  document.getElementById('feedbackMsg').textContent = '';
  document.getElementById('feedbackMsg').className = 'feedback-msg';
  document.getElementById('saveNote').textContent = '';
  document.getElementById('saveNote').className = 'save-note';
  document.getElementById('actionBtn').textContent = '檢查答案';
  input.focus();
}

async function checkAnswer(){
  const input = document.getElementById('answerInput');
  const errMsg = document.getElementById('errMsg');
  const val = input.value;
  if(!val.trim()){
    errMsg.textContent = '請先輸入答案';
    return;
  }
  errMsg.textContent = '';

  const item = sessionQueue[sessionIdx];
  const correct = normalizeAnswer(val) === normalizeAnswer(item.w);
  const feedbackEl = document.getElementById('feedbackMsg');

  if(correct){
    input.classList.add('correct');
    feedbackEl.textContent = '答對了！';
    feedbackEl.className = 'feedback-msg ok';
    sessionCorrect++;
  } else {
    input.classList.add('wrong');
    feedbackEl.textContent = '答錯了，正確答案：' + item.w;
    feedbackEl.className = 'feedback-msg no';
    sessionWrongWords.push(item);
  }

  answered = true;
  const saveNote = document.getElementById('saveNote');

  if(isTestMode){
    // Test mode: just score it, don't touch mastery progress.
    saveNote.textContent = '';
    saveNote.className = 'save-note';
  } else {
    document.getElementById('actionBtn').textContent = '儲存中…';
    document.getElementById('actionBtn').disabled = true;

    const result = await recordAnswer(item.s, correct);
    if(result.newlyMastered) sessionNewMastered++;

    saveNote.textContent = result.saved ? '✅ 這一題已儲存' : '⚠️ 這一題儲存失敗';
    saveNote.className = 'save-note ' + (result.saved ? 'ok' : 'bad');
    document.getElementById('actionBtn').disabled = false;
  }

  document.getElementById('actionBtn').textContent = (sessionIdx+1 < sessionQueue.length) ? '下一題' : (isTestMode ? '完成測驗' : '完成本次練習');
}

function nextOrFinish(){
  if(!answered){
    checkAnswer();
    return;
  }
  if(sessionIdx + 1 < sessionQueue.length){
    sessionIdx++;
    renderQuestion();
  } else {
    finishSession();
  }
}

function finishSession(){
  document.getElementById('quizProgressFill').style.width = '100%';
  const total = sessionQueue.length;
  const pct = total ? Math.round(sessionCorrect/total*100) : 0;
  document.getElementById('summaryAccuracy').textContent = pct + '%';
  document.getElementById('summaryCorrect').textContent = sessionCorrect + ' / ' + total;

  const titleEl = document.getElementById('summaryTitle');
  const masteredBox = document.getElementById('masteredStatBox');
  const wrongWrap = document.getElementById('wrongListWrap');

  if(isTestMode){
    titleEl.textContent = testWeekLabel + ' 完成';
    masteredBox.classList.add('hidden');
    if(sessionWrongWords.length > 0){
      wrongWrap.classList.remove('hidden');
      const listEl = document.getElementById('wrongList');
      listEl.innerHTML = '';
      sessionWrongWords.forEach(w => {
        const div = document.createElement('div');
        div.className = 'wrong-item';
        const wordEl = document.createElement('div');
        wordEl.className = 'wi-word';
        wordEl.textContent = w.w;
        const meaningEl = document.createElement('div');
        meaningEl.className = 'wi-meaning';
        meaningEl.textContent = w.c;
        div.appendChild(wordEl);
        div.appendChild(meaningEl);
        listEl.appendChild(div);
      });
    } else {
      wrongWrap.classList.add('hidden');
    }
  } else {
    titleEl.textContent = '本次練習完成';
    masteredBox.classList.remove('hidden');
    document.getElementById('summaryNewMastered').textContent = sessionNewMastered;
    wrongWrap.classList.add('hidden');
  }

  showScreen('summary');
}

}

let toastTimer = null;
function showToast(msg, type){
  let el = document.getElementById('toastEl');
  if(!el){
    el = document.createElement('div');
    el.id = 'toastEl';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.className = 'toast show ' + (type || '');
  if(toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); }, 2500);
}

// ---------- CUSTOM TEST ----------
function openCustomTestModal(){
  const list = document.getElementById('customTestList');
  list.innerHTML = '';
  WEEKS.forEach((week, idx) => {
    const start = week[0].s, end = week[week.length-1].s;
    const maxLen = week.length;
    const row = document.createElement('div');
    row.className = 'custom-week-row';
    row.innerHTML = `
      <div class="custom-week-check">
        <input type="checkbox" class="custom-week-cb" id="customCb${idx}" data-idx="${idx}">
        <label for="customCb${idx}">第 ${idx+1} 週（${start}–${end}）</label>
      </div>
      <input type="range" class="custom-week-slider" data-idx="${idx}" min="1" max="${maxLen}" value="${maxLen}" disabled>
      <div class="custom-week-count" id="customCount${idx}">已選 ${maxLen} 題</div>
    `;
    list.appendChild(row);
  });

  list.querySelectorAll('.custom-week-cb').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const idx = e.target.dataset.idx;
      const slider = list.querySelector(`.custom-week-slider[data-idx="${idx}"]`);
      slider.disabled = !e.target.checked;
    });
  });
  list.querySelectorAll('.custom-week-slider').forEach(slider => {
    slider.addEventListener('input', (e) => {
      const idx = e.target.dataset.idx;
      document.getElementById('customCount' + idx).textContent = '已選 ' + e.target.value + ' 題';
    });
  });

  document.getElementById('customTestModal').classList.remove('hidden');
}
document.getElementById('customTestCancelBtn').addEventListener('click', () => {
  document.getElementById('customTestModal').classList.add('hidden');
});
document.getElementById('customTestStartBtn').addEventListener('click', () => {
  const list = document.getElementById('customTestList');
  const checkedCbs = Array.from(list.querySelectorAll('.custom-week-cb')).filter(cb => cb.checked);
  if(checkedCbs.length === 0){
    alert('請至少選擇一個週次');
    return;
  }
  const selections = checkedCbs.map(cb => {
    const idx = parseInt(cb.dataset.idx, 10);
    const slider = list.querySelector(`.custom-week-slider[data-idx="${idx}"]`);
    return { idx, n: parseInt(slider.value, 10) };
  });
  document.getElementById('customTestModal').classList.add('hidden');
  startCustomTest(selections);
});

// ---------- STARRED WORDS ----------
function openStarredWeekModal(){
  const list = document.getElementById('starredWeekList');
  list.innerHTML = '';
  WEEKS.forEach((week, idx) => {
    const start = week[0].s, end = week[week.length-1].s;
    const count = week.filter(v => isStarred(v.s)).length;
    const btn = document.createElement('button');
    btn.className = 'test-item';
    btn.innerHTML = `<div class="ti-title">第 ${idx+1} 週（${start}–${end}）</div><div class="ti-sub">${count} 個收藏單字</div>`;
    btn.addEventListener('click', () => {
      document.getElementById('starredWeekModal').classList.add('hidden');
      showStarredWeek(idx);
    });
    list.appendChild(btn);
  });
  document.getElementById('starredWeekModal').classList.remove('hidden');
}
document.getElementById('starredWeekCloseBtn').addEventListener('click', () => {
  document.getElementById('starredWeekModal').classList.add('hidden');
});

let pendingUnstar = new Set();

function showStarredWeek(idx){
  const week = WEEKS[idx];
  const starredItems = week.filter(v => isStarred(v.s));
  document.getElementById('starredWeekLabel').textContent = '第 ' + (idx+1) + ' 週收藏';

  pendingUnstar = new Set();

  const wrap = document.getElementById('starredListWrap');
  wrap.innerHTML = '';

  if(starredItems.length === 0){
    const p = document.createElement('div');
    p.className = 'empty-note';
    p.textContent = '尚未收藏單字';
    wrap.appendChild(p);
    showScreen('starred');
    return;
  }

  const listEl = document.createElement('div');
  listEl.className = 'wrong-list';
  starredItems.forEach(v => {
    const div = document.createElement('div');
    div.className = 'wrong-item';
    const row = document.createElement('div');
    row.className = 'starred-item-row';

    const wordEl = document.createElement('div');
    wordEl.className = 'sr-word';
    wordEl.textContent = v.w;

    const posEl = document.createElement('div');
    posEl.className = 'sr-pos';
    posEl.textContent = v.p;

    const meaningEl = document.createElement('div');
    meaningEl.className = 'sr-meaning';
    meaningEl.textContent = v.c;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'star-remove-btn';
    removeBtn.textContent = '★';
    removeBtn.addEventListener('click', () => {
      if(pendingUnstar.has(v.s)){
        pendingUnstar.delete(v.s);
        removeBtn.textContent = '★';
        removeBtn.classList.remove('inactive');
      } else {
        pendingUnstar.add(v.s);
        removeBtn.textContent = '☆';
        removeBtn.classList.add('inactive');
      }
    });

    row.appendChild(wordEl);
    row.appendChild(posEl);
    row.appendChild(meaningEl);
    row.appendChild(removeBtn);
    div.appendChild(row);
    listEl.appendChild(div);
  });
  wrap.appendChild(listEl);
  showScreen('starred');
}
document.getElementById('starredBackBtn').addEventListener('click', async () => {
  if(pendingUnstar.size > 0){
    pendingUnstar.forEach(seq => {
      if(progress.starred) delete progress.starred[seq];
    });
    await doSave();
    pendingUnstar.clear();
  }
  showScreen('home');
});

// ---------- SEARCH ----------
function matchesQuery(item, q){
  const ql = q.trim();
  if(!ql) return false;
  const isAsciiQuery = /^[A-Za-z]+$/.test(ql);
  if(isAsciiQuery){
    return item.w.toLowerCase().startsWith(ql.toLowerCase());
  }
  return item.c.includes(ql);
}

function makeResultItem(item, onClick){
  const btn = document.createElement('button');
  btn.className = 'search-result-item';
  const line1 = document.createElement('div');
  line1.className = 'sr-line1';
  line1.textContent = item.w;
  const line2 = document.createElement('div');
  line2.className = 'sr-line2';
  line2.textContent = item.p + ',' + item.c;
  btn.appendChild(line1);
  btn.appendChild(line2);
  btn.addEventListener('click', onClick);
  return btn;
}

async function addSearchHistory(seq){
  if(!progress.searchHistory) progress.searchHistory = [];
  progress.searchHistory = progress.searchHistory.filter(s => s !== seq);
  progress.searchHistory.unshift(seq);
  if(progress.searchHistory.length > 8){
    progress.searchHistory = progress.searchHistory.slice(0, 8);
  }
  await doSave();
}

function renderSearchHistory(){
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = '';
  const hist = progress.searchHistory || [];
  if(hist.length === 0) return;

  const header = document.createElement('h2');
  header.className = 'section-title';
  header.style.textAlign = 'left';
  header.textContent = '最近查詢';
  resultsEl.appendChild(header);

  hist.forEach(seq => {
    const item = VOCAB.find(v => v.s === seq);
    if(!item) return;
    const btn = makeResultItem(item, async () => {
      await addSearchHistory(item.s);
      showWordDetail(item);
    });
    resultsEl.appendChild(btn);
  });
}

function renderSearchResults(q){
  const resultsEl = document.getElementById('searchResults');
  resultsEl.innerHTML = '';
  const ql = q.trim();
  if(!ql){
    renderSearchHistory();
    return;
  }
  const isAsciiQuery = /^[A-Za-z]+$/.test(ql);
  const matches = VOCAB.filter(item => matchesQuery(item, ql))
    .sort((a, b) => a.w.localeCompare(b.w))
    .slice(0, 40);

  if(matches.length === 0){
    const p = document.createElement('div');
    p.className = 'empty-note';
    p.textContent = '找不到符合的單字';
    resultsEl.appendChild(p);
    return;
  }

  matches.forEach(item => {
    const btn = makeResultItem(item, async () => {
      if(isAsciiQuery){
        await addSearchHistory(item.s);
      }
      showWordDetail(item);
    });
    resultsEl.appendChild(btn);
  });
}

function showWordDetail(item){
  document.getElementById('wdWord').textContent = item.w;
  document.getElementById('wdPos').textContent = POS_LABEL[item.p] || item.p;
  document.getElementById('wdMeaning').textContent = item.c;
  const exBox = document.getElementById('wdExampleBox');
  if(item.e){
    document.getElementById('wdExampleText').textContent = item.e;
    exBox.classList.remove('hidden');
  } else {
    exBox.classList.add('hidden');
  }
  showScreen('wordDetail');
}

  document.getElementById('searchInput').value = '';

document.getElementById('exportBtn').addEventListener('click', () => {
  const payload = {
    app: 'aviation-vocab', version: 1,
    exportedAt: new Date().toISOString(),
    progress: progress
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = todayStr();
  a.href = url;
  a.download = 'vocab-progress-' + stamp + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
});

document.getElementById('importBtn').addEventListener('click', () => {
  document.getElementById('importFile').click();
});

document.getElementById('importFile').addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async () => {
    try{
      const parsed = JSON.parse(reader.result);
      const p = parsed && parsed.progress ? parsed.progress : parsed;
      if(!p || typeof p !== 'object' || typeof p.words !== 'object'){
        alert('這個檔案格式看起來不正確，無法匯入。');
        return;
      }
      progress = { words: p.words || {}, days: Array.isArray(p.days) ? p.days : [], starred: p.starred || {}, searchHistory: Array.isArray(p.searchHistory) ? p.searchHistory : [] };
      await doSave();
      showScreen('home');
      alert('匯入成功！');
    }catch(err){
      alert('讀取失敗，請確認選的是本App匯出的備份檔。');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

(async function init(){
  await detectStorageMode();
  progress = await loadProgress();
  document.getElementById('loadingScreen').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');
  showScreen('home');
  renderStorageStatus();
})();
