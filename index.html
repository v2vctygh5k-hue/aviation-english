<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Aviation Technical English · 背單字</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1218;
    --panel:#161d26;
    --panel-2:#1d2530;
    --border:#2a3442;
    --border-soft:#212a35;
    --text:#e9edf3;
    --text-dim:#8b96a5;
    --text-faint:#5b6573;
    --amber:#ffb020;
    --amber-dim:#8a5c14;
    --amber-glow:rgba(255,176,32,0.14);
    --green:#3ddc97;
    --green-dim:rgba(61,220,151,0.14);
    --red:#ff6161;
    --red-dim:rgba(255,97,97,0.14);
    --blue:#5cc2f2;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:520px;
    margin:0 auto;
    padding:18px 16px 48px;
    min-height:100vh;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  .display{font-family:'Space Grotesk',sans-serif;}

  /* top placard */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:14px;
    border-bottom:1px solid var(--border-soft);
    margin-bottom:18px;
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .topbar-left{display:flex;align-items:center;gap:12px;}
  .topbar-actions{display:flex;align-items:center;gap:8px;}
  .menu-btn{
    background:var(--panel);border:1px solid var(--border);color:var(--text);
    border-radius:9px;width:36px;height:36px;font-size:16px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;flex:none;
  }
  .menu-btn:active{transform:scale(0.94);}
  .brand-dot{
    width:9px;height:9px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 8px var(--green);
    flex:none;
  }
  .brand-text h1{
    margin:0;font-size:15px;font-weight:700;letter-spacing:0.06em;
    text-transform:uppercase;
  }
  .brand-text p{
    margin:2px 0 0;font-size:11px;color:var(--text-dim);letter-spacing:0.04em;
  }

  /* menu / reset-week / test-select modal content */
  .menu-list{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .menu-item{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:14px;text-align:left;color:var(--text);cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .menu-item:active{transform:scale(0.98);}
  .menu-item .mi-title{font-weight:600;font-size:14px;margin-bottom:3px;}
  .menu-item .mi-sub{font-size:11.5px;color:var(--text-dim);}

  .select-all-row{
    display:flex;align-items:center;gap:8px;padding:2px 2px 12px;
    font-size:12.5px;color:var(--text-dim);
  }
  .select-all-row input{accent-color:var(--amber);width:16px;height:16px;}

  .week-check-list{
    display:flex;flex-direction:column;gap:8px;margin-bottom:16px;
    max-height:320px;overflow-y:auto;
  }
  .week-check-row{
    display:flex;align-items:center;gap:10px;background:var(--panel-2);
    border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px;
  }
  .week-check-row input[type=checkbox]{width:17px;height:17px;accent-color:var(--amber);flex:none;}
  .week-check-row label{font-size:12.5px;flex:1;color:var(--text);}
  .week-check-row .wc-count{font-size:10.5px;color:var(--text-dim);white-space:nowrap;}

  .test-list{display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;}
  .test-item{
    background:var(--panel-2);border:1px solid var(--border);border-radius:10px;
    padding:13px 14px;text-align:left;cursor:pointer;color:var(--text);
    font-family:'Inter',sans-serif;
  }
  .test-item:active{transform:scale(0.98);}
  .test-item .ti-title{font-weight:600;font-size:14px;}
  .test-item .ti-sub{font-size:11.5px;color:var(--text-dim);margin-top:3px;}

  .mode-label{
    font-size:11px;color:var(--amber);letter-spacing:0.03em;
    text-align:center;margin-bottom:8px;
  }

  /* overall status strip */
  .status-strip{
    display:grid;grid-template-columns:1fr 1fr 1fr;
    gap:1px;background:var(--border-soft);
    border:1px solid var(--border-soft);
    border-radius:10px;overflow:hidden;
    margin-bottom:20px;
  }
  .status-cell{
    background:var(--panel);
    padding:10px 8px;text-align:center;
  }
  .status-cell .num{
    font-family:'JetBrains Mono',monospace;
    font-size:20px;font-weight:700;color:var(--amber);
    line-height:1.1;
  }
  .status-cell .lbl{
    font-size:10px;color:var(--text-dim);
    margin-top:3px;letter-spacing:0.03em;
  }
  .status-cell.green .num{color:var(--green);}
  .status-cell.blue .num{color:var(--blue);}

  .fuelbar-outer{
    height:6px;border-radius:4px;background:var(--panel-2);
    border:1px solid var(--border-soft);overflow:hidden;margin-bottom:26px;
  }
  .fuelbar-inner{
    height:100%;background:linear-gradient(90deg,var(--amber),var(--green));
    border-radius:4px;transition:width .5s ease;
  }

  h2.section-title{
    font-family:'Space Grotesk',sans-serif;
    font-size:13px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--text-dim);margin:0 0 12px;
  }

  /* week cards */
  .week-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:8px;}
  .week-card{
    background:var(--panel);border:1px solid var(--border);
    border-radius:12px;padding:14px;cursor:pointer;
    transition:border-color .15s ease, transform .1s ease;
    text-align:left;color:inherit;
  }
  .week-card:active{transform:scale(0.98);}
  .week-card:hover{border-color:var(--amber-dim);}
  .week-card .wk-label{
    font-family:'Space Grotesk',sans-serif;font-size:12px;
    letter-spacing:0.08em;color:var(--text-dim);text-transform:uppercase;
  }
  .week-card .wk-range{
    font-family:'JetBrains Mono',monospace;font-size:17px;font-weight:700;
    margin:4px 0 10px;color:var(--text);
  }
  .week-progress-track{
    height:5px;border-radius:3px;background:var(--panel-2);
    border:1px solid var(--border-soft);overflow:hidden;margin-bottom:6px;
  }
  .week-progress-fill{height:100%;background:var(--green);border-radius:3px;}
  .week-card .wk-stat{font-size:11px;color:var(--text-dim);}
  .week-card .wk-stat b{color:var(--text);font-weight:600;}
  .week-card.done{border-color:var(--green-dim);}
  .week-card.done .wk-range{color:var(--green);}

  /* quiz screen */
  .quiz-topbar{
    display:flex;align-items:center;justify-content:space-between;
    margin-bottom:14px;gap:8px;
  }
  .quiz-topbar-left{display:flex;gap:8px;}
  .save-btn{color:var(--amber);border-color:var(--amber-dim);white-space:nowrap;}
  .back-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .back-btn:active{transform:scale(0.96);}
  .quiz-progress-text{
    font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--text-dim);
  }
  .quiz-progress-track{
    height:4px;border-radius:3px;background:var(--panel-2);
    overflow:hidden;margin-bottom:20px;
  }
  .quiz-progress-fill{height:100%;background:var(--amber);border-radius:3px;transition:width .3s ease;}

  .card-panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:24px 20px;text-align:center;
    position:relative;
  }
  .star-btn{
    position:absolute;top:12px;right:14px;
    background:none;border:none;font-size:23px;line-height:1;
    color:var(--text-faint);cursor:pointer;padding:4px;
  }
  .star-btn:active{transform:scale(0.9);}
  .star-btn.active{color:var(--amber);}
  .pos-chip{
    display:inline-block;background:var(--amber-glow);color:var(--amber);
    border:1px solid var(--amber-dim);border-radius:20px;
    padding:4px 14px;font-size:12px;font-weight:600;letter-spacing:0.03em;
    margin-bottom:16px;
  }
  .meaning{
    font-size:24px;font-weight:600;line-height:1.4;margin:0 0 6px;
  }
  .letter-count{
    font-size:11px;color:var(--text-faint);margin-bottom:22px;
    font-family:'JetBrains Mono',monospace;letter-spacing:0.05em;
  }
  .hint-row{
    display:flex;flex-wrap:wrap;justify-content:center;
    gap:3px;margin-bottom:22px;min-height:34px;align-items:flex-end;
  }
  .ltr-box{
    width:22px;height:30px;border-bottom:2px solid var(--amber-dim);
    display:inline-flex;align-items:flex-end;justify-content:center;
    font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:700;
    color:var(--amber);padding-bottom:3px;
  }
  .sep-space{width:12px;}
  .sep-hyphen{
    align-self:flex-end;color:var(--text-faint);font-size:18px;
    padding-bottom:6px;font-family:'JetBrains Mono',monospace;
  }

  .answer-input{
    width:100%;background:var(--panel-2);border:1.5px solid var(--border);
    border-radius:10px;color:var(--text);font-size:18px;
    padding:12px 14px;text-align:center;font-family:'JetBrains Mono',monospace;
    text-transform:uppercase;letter-spacing:0.04em;margin-bottom:12px;
    outline:none;
  }
  .answer-input:focus{border-color:var(--amber);}
  .answer-input.correct{border-color:var(--green);color:var(--green);}
  .answer-input.wrong{border-color:var(--red);color:var(--red);}

  .err-msg{
    font-size:12px;color:var(--red);margin:-4px 0 12px;min-height:16px;
  }

  .feedback-msg{
    font-size:13px;margin:-2px 0 14px;min-height:18px;font-weight:600;
  }
  .feedback-msg.ok{color:var(--green);}
  .feedback-msg.no{color:var(--red);}

  .btn-primary{
    width:100%;background:var(--amber);color:#241503;border:none;
    border-radius:10px;padding:13px;font-size:15px;font-weight:700;
    cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:0.02em;
  }
  .btn-primary:active{transform:scale(0.98);}
  .btn-secondary{
    width:100%;background:none;color:var(--text-dim);border:1px solid var(--border);
    border-radius:10px;padding:12px;font-size:14px;cursor:pointer;
    font-family:'Inter',sans-serif;margin-top:10px;
  }

  /* summary screen */
  .summary-panel{
    background:var(--panel);border:1px solid var(--border);
    border-radius:16px;padding:32px 20px;text-align:center;
  }
  .summary-panel .big-num{
    font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;
    color:var(--green);margin:6px 0;
  }
  .summary-panel .sub{color:var(--text-dim);font-size:13px;margin-bottom:24px;}

  .wrong-list-wrap{margin-bottom:20px;}
  .wrong-list-wrap .section-title{margin-bottom:10px;}
  .wrong-list{
    display:flex;flex-direction:column;gap:8px;text-align:left;
    max-height:320px;overflow-y:auto;
  }
  .wrong-item{
    background:var(--panel-2);border:1px solid var(--border-soft);
    border-radius:8px;padding:10px 12px;
  }
  .wrong-item .wi-word{
    font-family:'JetBrains Mono',monospace;font-weight:700;
    color:var(--red);font-size:14px;
  }
  .wrong-item .wi-meaning{font-size:12px;color:var(--text-dim);margin-top:2px;}

  .starred-item-row{
    display:flex;align-items:center;gap:10px;
  }
  .starred-item-row .sr-word{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13.5px;
    color:var(--text);flex:0 0 auto;
  }
  .starred-item-row .sr-pos{
    font-size:11px;color:var(--amber);flex:0 0 auto;white-space:nowrap;
  }
  .starred-item-row .sr-meaning{
    font-size:12.5px;color:var(--text-dim);flex:1 1 auto;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .star-remove-btn{
    background:none;border:none;color:var(--amber);font-size:21px;
    cursor:pointer;padding:2px 4px;flex:none;line-height:1;
  }
  .star-remove-btn:active{transform:scale(0.9);}
  .star-remove-btn.inactive{color:var(--text-faint);}
  .summary-stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:26px;}
  .summary-stats div{background:var(--panel-2);border-radius:10px;padding:12px;}
  .summary-stats .n{font-family:'JetBrains Mono',monospace;font-size:20px;font-weight:700;}
  .summary-stats .l{font-size:11px;color:var(--text-dim);margin-top:3px;}

  /* loading */
  .loading-screen{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    min-height:70vh;color:var(--text-dim);font-size:13px;gap:10px;
  }
  .spinner{
    width:22px;height:22px;border-radius:50%;
    border:2.5px solid var(--border);border-top-color:var(--amber);
    animation:spin 0.8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* confirm modal */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,0.6);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:20px;
  }
  .modal-box{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:20px;max-width:320px;width:100%;
  }
  .modal-box p{font-size:14px;color:var(--text);margin:0 0 18px;line-height:1.5;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{
    flex:1;padding:10px;border-radius:8px;font-size:13px;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .modal-actions .cancel{background:none;border:1px solid var(--border);color:var(--text-dim);}
  .modal-actions .confirm{background:var(--red);border:none;color:#2a0a0a;font-weight:700;}
  .modal-actions .confirm-start{background:var(--amber);border:none;color:#241503;font-weight:700;}

  .custom-test-list{
    max-height:400px;overflow-y:auto;margin-bottom:16px;
    display:flex;flex-direction:column;gap:10px;
  }
  .custom-week-row{
    background:var(--panel-2);border:1px solid var(--border-soft);
    border-radius:10px;padding:12px;
  }
  .custom-week-check{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
  .custom-week-check input[type=checkbox]{width:17px;height:17px;accent-color:var(--amber);flex:none;}
  .custom-week-check label{font-size:13px;color:var(--text);}
  .custom-week-slider{width:100%;accent-color:var(--amber);display:block;}
  .custom-week-slider:disabled{opacity:0.35;}
  .custom-week-count{
    font-size:11.5px;color:var(--text-dim);text-align:center;margin-top:6px;
    font-family:'JetBrains Mono',monospace;
  }

  .hidden{display:none !important;}

  .search-input{
    width:100%;background:var(--panel-2);border:1.5px solid var(--border);
    border-radius:10px;color:var(--text);font-size:15px;
    padding:12px 14px;margin-bottom:14px;outline:none;
    font-family:'Inter',sans-serif;
  }
  .search-input:focus{border-color:var(--amber);}

  .search-result-item{
    background:var(--panel);border:1px solid var(--border);
    border-radius:10px;padding:12px 14px;margin-bottom:8px;
    text-align:left;width:100%;color:inherit;cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .search-result-item:active{transform:scale(0.98);}
  .search-result-item .sr-line1{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:14px;
    color:var(--text);
  }
  .search-result-item .sr-line2{
    font-size:12px;color:var(--text-dim);margin-top:3px;
  }

  .wd-word{
    font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;
    color:var(--text);margin-bottom:14px;letter-spacing:0.02em;
  }
  .wd-meaning{
    font-size:19px;color:var(--text);line-height:1.6;margin-top:18px;
  }
  .example-box{
    background:var(--panel);border:1px solid var(--border);
    border-radius:14px;padding:16px 18px;margin-top:14px;
  }
  .example-box .section-title{margin-bottom:8px;}
  .example-text{
    font-size:14.5px;color:var(--text-dim);line-height:1.75;
    text-align:left;white-space:pre-wrap;
    overflow-wrap:break-word;word-break:break-word;
  }
  .empty-note{font-size:12px;color:var(--text-faint);text-align:center;padding:20px 0;}

  .storage-status{
    font-size:11.5px;padding:9px 12px;border-radius:8px;margin-bottom:16px;
    border:1px solid var(--border-soft);color:var(--text-dim);background:var(--panel);
    line-height:1.5;
  }
  .storage-status.ok{color:var(--green);border-color:rgba(61,220,151,0.3);}
  .storage-status.warn{color:var(--amber);border-color:rgba(255,176,32,0.35);}
  .storage-status.bad{color:var(--red);border-color:rgba(255,97,97,0.35);}

  .backup-row{display:flex;gap:10px;margin-bottom:8px;}
  .backup-btn{margin-top:0;font-size:12.5px;padding:11px 8px;}
  .backup-note{font-size:11px;color:var(--text-faint);line-height:1.5;padding-bottom:6px;}

  .save-note{font-size:11px;min-height:14px;margin:-8px 0 12px;color:var(--text-faint);}
  .save-note.ok{color:var(--green);}
  .save-note.bad{color:var(--red);}

  .toast{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:var(--panel);border:1px solid var(--border);
    padding:11px 18px;border-radius:10px;font-size:13px;
    z-index:100;box-shadow:0 6px 24px rgba(0,0,0,0.5);
    opacity:0;pointer-events:none;transition:opacity .25s ease;
    max-width:85%;text-align:center;
  }
  .toast.show{opacity:1;}
  .toast.ok{color:var(--green);border-color:rgba(61,220,151,0.4);}
  .toast.bad{color:var(--red);border-color:rgba(255,97,97,0.4);}

  @media (max-width:360px){
    .week-grid{gap:10px;}
    .meaning{font-size:21px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app">

  <div class="loading-screen" id="loadingScreen">
    <div class="spinner"></div>
    <div>系統啟動中…</div>
  </div>

  <div id="mainContent" class="hidden">

    <div class="topbar">
      <div class="brand">
        <div class="brand-dot"></div>
        <div class="brand-text">
          <h1>Aviation Technical English</h1>
          <p>Level 1 · 詞彙訓練系統</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="menu-btn" id="searchBtn" aria-label="搜尋">🔍</button>
        <button class="menu-btn" id="menuBtn" aria-label="選單">☰</button>
      </div>
    </div>

    <!-- HOME SCREEN -->
    <div id="homeScreen">
      <div class="storage-status" id="storageStatus">檢查儲存狀態中…</div>

      <div class="status-strip">
        <div class="status-cell">
          <div class="num mono" id="statMastered">0</div>
          <div class="lbl">已熟記</div>
        </div>
        <div class="status-cell green">
          <div class="num mono" id="statTotal">0</div>
          <div class="lbl">單字總數</div>
        </div>
        <div class="status-cell blue">
          <div class="num mono" id="statDays">0</div>
          <div class="lbl">累積練習天數</div>
        </div>
      </div>
      <div class="fuelbar-outer"><div class="fuelbar-inner" id="overallFill" style="width:0%"></div></div>

      <h2 class="section-title">選擇週次</h2>
      <div class="week-grid" id="weekGrid"></div>

      <h2 class="section-title" style="margin-top:24px;">備份與還原</h2>
      <div class="backup-row">
        <button class="btn-secondary backup-btn" id="exportBtn">📤 匯出進度備份</button>
        <button class="btn-secondary backup-btn" id="importBtn">📥 匯入進度備份</button>
        <input type="file" id="importFile" accept="application/json" class="hidden">
      </div>
      <div class="backup-note">建議每次練習完都匯出一份存起來，避免因裝置或瀏覽器限制而遺失進度。匯入時會用備份檔完全覆蓋目前的進度。</div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quizScreen" class="hidden">
      <div class="quiz-topbar">
        <div class="quiz-topbar-left">
          <button class="back-btn" id="quizBackBtn">← 返回</button>

e taken."},{"s":238,"w":"FOREFLAP","p":"n","c":"前襟翼","e":"1. PERFORM AN ON-AIRPLANE DIMENSIONAL INSPECTION OF THE LEFT WING INBOARD TRAILING EDGE FOREFLAP FLIGHT & CENTER TOGGLE ROLLER INSPECT ENTIRE CIRCUMFERENCE OF THE OUTER RACES FOR FLAT SPOT WEAR."},{"s":239,"w":"FORK","p":"n","c":"分歧, 分叉"},{"s":240,"w":"FORMALDEHYDE","p":"n","c":"甲醛","e":"1. AIRCRAFT TOILET DEODORANT IS NON FORMALDEHYDE BASED."},{"s":241,"w":"FORWARD","p":"adj","c":"向前","e":"1. THE CONTROL UNIT IS INSTALLED IN THE FORWARD PART OF THE CARGO COMPARTMENT."},{"s":242,"w":"FRAME","p":"n","c":"結構","e":"1. The left access door will open fully and the right access door will drop approximately one inch (2.5 cm) from the fuselage frame when the last latch is opened."},{"s":243,"w":"FREEDOM","p":"n","c":"自由；獨立自主"},{"s":244,"w":"FREELY","p":"adv","c":"自由地,無拘束地","e":"1. OXYGEN MUST FLOW FREELY FROM THE END OF THE HOSE.\n2. Make sure that the nuts are free to turn on the bolts."},{"s":245,"w":"FREEZE","p":"v","c":"結冰,凝固","e":"1. In cold weather the water can freeze on the inside and outside of the fuel tanks."},{"s":246,"w":"FREIGHTER","p":"n","c":"貨輪；運輸飛機","e":"1. Hose chafing with connector under the box (freighter only) or guard assembly"},{"s":247,"w":"FREQUENT","p":"adj","c":"時常發生的,頻繁的","e":"1. FREQUENT INSPECTION OF THESE AREAS IS NECESSARY."},{"s":248,"w":"FRET","p":"n","c":"侵蝕；腐蝕；磨損；蛀蝕","e":"1. CHECK THE CONNECTORS FOR FRET, CORROSION AND CRACK."},{"s":249,"w":"FULLY","p":"adv","c":"完全地；徹底地"},{"s":250,"w":"FUNCTION","p":"n","c":"功能,作用","e":"1. THE PRIMARY FUNCTION OF THIS UNIT IS TO CONTROL THE FUEL FLOW.\n2. Make sure the function of the fueling power control switch operates correctly."},{"s":251,"w":"FUSE","p":"n","c":"電阻式保險絲"},{"s":252,"w":"FUSE BOLT","p":"n","c":"保險螺桿","e":"1. FUSE BOLT (Page 32 : Figure 306. Outboard Trailing Edge Flap Tracks Servicing (Lubrication) (Sheet 1))"},{"s":253,"w":"FUSELAGE","p":"n","c":"【空】機身","e":"PERFORM DETAIL VISUAL INSPECTION FOR FUSELAGE EXTERNAL SKIN AT STA 8 it.\n2. Fuel passes through the atomizers to the combustion chamber, where it is ignited."},{"s":285,"w":"ILLUMINATE","p":"v","c":"照亮;照射","e":"1. MAKE SURE THAT THE STROBE LIGHT ILLUMINATES THE TRACKING PLATES.\n2. The SYS FAULT indicators are at the top of the hydraulic control module. These lights illuminate amber when any of the following conditions is detected:"},{"s":286,"w":"ILLUSTRATED","p":"adj","c":"圖示"},{"s":287,"w":"IMMEDIATELY","p":"adv","c":"直接地;立即","e":"1. MAKE SURE THAT THE SWITCH IMMEDIATELY GOES BACK TO “OFF”.\n2. Wash your skin or clothing immediately after it touches paint stripper, etchant or conversion coating material."},{"s":288,"w":"INBOARD","p":"adj","c":"內側的","e":"1. REMOVE THE INBOARD FAIRING OF THE FLAP HINGE.\n2. Check underside of inboard wing, leading edge flaps and lower surface for damage and fluid leaks."},{"s":289,"w":"INCLUDE","p":"v","c":"包括,包含","e":"1. THIS CHAPTER INCLUDES THE PROCEDURES FOR THE REMOVAL OF THE LANDING GEAR.\n2. Apply corrosion inhibiting compound to the doorsill and body sill areas but do not include the seal and the seal depressors."},{"s":290,"w":"INCORRECT","p":"adj","c":"不正確的;錯誤的","e":"1. IF YOU FIND THAT THE QUANTITY OF AIR FROM THE VENT MAST IS INCORRECT, DO A SYSTEM TEST.\n2. If the two ailerons move in the same direction at the same time,the turnbuckles are adjusted incorrectly."},{"s":291,"w":"INCREASE","p":"v","c":"增大;增加","e":"1. A HIGHER TEMPERATURE INCREASES THE SPEED OF EVAPORATION.\n2. Increase the torque values to 100 inch-pounds."},{"s":292,"w":"INDEPENDENTLY","p":"adv","c":"獨立地","e":"1. THE EMERGENCY SYSTEM IS CONTROLLED INDEPENDENTLY."},{"s":293,"w":"INDICATION","p":"n","c":"指示","e":"1. MAKE SURE THAT THE INDICATION IS CORRECT."},{"s":294,"w":"INFLATE","p":"v","c":"使充氣;使膨脹","e":"1. Inflate the tire with nitrogen to the pressure in the Tire Pressure Limit charts.\n2. Do adjustments to the tire inflation pressure when the tires are cool (ambient temperature)"},{"s":295,"w":"INHIBITOR","p":"n","c":"抗化劑","e":"1. KEEP FLAME, ELECTRICAL, AND HEAT SOURCES AWAY FROM THE CORROSION INHIBITOR UNTIL IT FULLY DRIES FROM ALL THE SURFACES. DO NOT INSTALL THE INSULATION BLANKETS WHILE THE AREA IS WET. CORROSION INHIBITORS ARE FLAMMABLE."},{"s":296,"w":"INJURY","p":"n","c":"傷害;損害","e":"1. BEND THE ENDS OF THE LOCKING WIRE TO PREVENT INJURY.\n2. Make sure end of safety wire cannot injure personnel."},{"s":297,"w":"INSPECTION","p":"n","c":"檢查,檢驗","e":"1. USE A VOLTMETER TO DO THIS INSPECTION.\n2. Inspect the filter assembly for contaminaintion."},{"s":298,"w":"INSTALL","p":"v","c":"安裝,設置","e":"1. Fasteners shall be installed by turning the nut unless the nut is not wrenchable or lack of tooling access.\n2. REFER TO PARA. 3 FOR INSTALLATION OF THE CANOPY."},{"s":299,"w":"INSTRUMENT","p":"n","c":"儀器;器具,器械","e":"1. ALL THE INSTRUMENTS ARE ON THE LEFT QUARTER PANEL.\n2. Put a leveling instrument (accurate within 2 minutes of arc) on the leveling plate in the right main gear wheelwell."},{"s":300,"w":"INSULATION","p":"n","c":"隔離墊","e":"1. Make sure that you do not damage the insulation when you remove the hydraulic tube.\n2. Look for the evidence of the black powder residue on the insulator around the contact."},{"s":301,"w":"INTENSITY","p":"n","c":"強度","e":"1. OPERATE THE DIMMER SWITCH AND MAKE SURE THAT THE INTENSITY OF THE LIGHT CHANGES.\n2. Electromagnetic energy of this intensity can ignite fuel vapors and cause a fire."},{"s":302,"w":"INTERCHANGE","p":"v","c":"交換位置;交替發生","e":"1. INTERCHANGE THE NO.1 AND NO.2 COMPUTERS. THEN DO THE TEST AGAIN.\n2. FLUSH THE SYSTEM FULLY WITH WATER IF TYPE OF FLUID WILL BE CHANGED. DIFFERENT TYPES OF FLUID MAY NOT BE INTERCHANGEABLE. PACE SP116-13 AND KILLFROST NO. 3 WINDSHIELD WASHER FLUIDS ARE INTERCHANGEABLE. IT IS NOT NECESSARY TO FLUSH THE SYSTEM."},{"s":303,"w":"INTERFACE","p":"n","c":"界面,分界面","e":"1. A maximum interface separation of 0.004 inch is permissible at the bolt shank in fay seal areas, and in non faying seal areas a separation of less than 0.002 inch is permissible. To facilitate installation, holes may also be lubricated with cetyl alcoho\n2. Water in the fuel tank comes from condensation or from fuel that is uploaded during a refuel operation. Removal of water will help minimize microbial growth that exists at the fuel/water interface."},{"s":304,"w":"INTERMITTENT","p":"adj","c":"間歇的;週期性的","e":"1. THIS CAUSES INTERMITTENT OPERATION OF THE WARNING LIGHTS.\n2. The intermittent operation of the warning light is caused by the failed fire detection sensor."},{"s":305,"w":"INTERNAL","p":"adj","c":"內的,內部的","e":"1. MAKE SURE THAT FUEL COMES OUT OF THE INTERNAL EJECTORS.\n2. Make sure that a light flow of air comes out from the internal ejector."},{"s":306,"w":"INTERVAL","p":"n","c":"間隔;距離","e":"1. The lavatory fire extinguisher will be weighed at a scheduled maintenance interval.\n2. If you see corrosion on the lug surface adjacent to the bushing flange, you must replace the bushing and repair the lug surface at or before a subsequent maintenance interval."},{"s":307,"w":"IRREGULAR","p":"adj","c":"不規則的,無規律的","e":"1. IF THE SIGNALS ARE IRREGULAR, REPLACE THE UNIT.\n2. A detailed inspection is an intensive examination of a specific item, installation or assembly, to detect damage, failure or irregularity."},{"s":308,"w":"IRRITATION","p":"n","c":"刺激;過敏;疼痛","e":"1. GET IMMEDIATE MEDICAL AID IF IRRITATION OCCURS."},{"s":309,"w":"ISOLATE","p":"v","c":"孤立;隔離;脫離","e":"1. OPEN THE CIRCUIT BREAKER TO ISOLATE THE SLAT SYSTEM.\n2. Check the systems only if a malfunction was reported during the flight. Refer to the applicable Fault Isolation Manual (FIM) procedures."},{"s":310,"w":"ISSUE","p":"v","c":"發行;發佈","e":"1. IF THE REMAIN SERVICE LIFE LESS THAN TASK CARD REQUIREMENT, PLEASE ISSUE NRC TO REPLACE IT."},{"s":311,"w":"JOINT","p":"n","c":"接頭,接縫","e":"1. Particular attention should be given to faying surface joints.\n2. DO NOT REMOVE THE LAYER OF GREASE FROM MECHANICAL JOINTS. THIS GREASE LUBRICATES THE JOINT AND PREVENTS CORROSION."},{"s":312,"w":"JOY STICK","p":"n","c":"操作摃","e":"1. Hold the joystick switch on the cargo control panel to the IN or OUT position until the drive-wheels extend."},{"s":313,"w":"KIT","p":"n","c":"工具箱;零件包"},{"s":314,"w":"KNOB","p":"n","c":"球形把手;(收音機等的)旋鈕;圓形的突出","e":"1. KNOB THE BAYONET MCD PROBE (SCALLOPED OR KNURLED KNOB) ATTACHES TO THE HOUSING BY BAYONET PINS AND SLOTS. YOU MUST PUSH THE PROBE IN BEFORE YOU TURN IT. REMOVE IT WITH YOUR HAND."},{"s":315,"w":"LACE","p":"n","c":"綁帶","e":"1. \"PERFORM VISUAL INSPECTION ON THE PROTECTIVE LACE BETWEEN THE BRAKE HYDRAULIC HOSE AND POSITION ACTUATOR HOSE\""},{"s":316,"w":"LACK","p":"v","c":"缺乏;不足","e":"1. APPLY BMS 3-33 GREASE PER AMM TO WHERE IS RECOMMENDED, DO NOT USE ALTERNATE UNLESS LACK OF BMS 3-33 GREASE."},{"s":317,"w":"LADDER","p":"n","c":"梯子","e":"1. LADDER STANDS, LADDERS OR PLATFORMS ARE REQUIRED TO GAIN PROXIMITY TO THE FIXED L/E AND T/E AREA BEING INSPECTED."},{"s":318,"w":"LAMINATED","p":"adj","c":"由薄片組成的","e":"1. THIS PANEL IS MADE OF LAMINATED CARBON FIBER.\n2. The passenger compartment linings have a Tedlar lamination that makes them easy to clean."},{"s":319,"w":"LAMP","p":"n","c":"照明裝置","e":"1. Operational Check of Cockpit and NLG Warning Lamps."},{"s":320,"w":"LATCH","p":"n","c":"閂;門閂;窗閂","e":"1. Verify that the waste flap is securely latched and that the retaining pins are completely extended.\n2. The main entry doors lubrication (a) Hinge and body torque tube, chain and sprocket mechanism, latch mechanisms and latch rollers lubrication (b) Ball and splined shaft/mode selector mechanism lubrication."},{"s":321,"w":"LATERAL","p":"adj","c":"橫的,橫向的","e":"1. Lateral fuel imbalance must not exceed 3000 lb (1361 kg) for main tanks 1 and\n4.\n2. The airplane has two types of leveling indicators in the wheel well of the right body landing gear. It has a plumb bob scale and the lateral and longitudinal inclinometers"},{"s":322,"w":"LAYER","p":"n","c":"層;階層;地層","e":"1. APPLY A THIN LAYER OF SEALING COMPOUND ON THE BARE METAL.\n2. Use the G01043 lint-free cloth to apply a thin layer of D00633 grease to the control cable for the full length of travel."},{"s":323,"w":"LEAKAGE","p":"n","c":"漏;洩漏","e":"1. Use your hand to feel leakage/seepage condition.\n2. Examine the swivel couplings for leaks."},{"s":324,"w":"LEGEND","p":"n","c":"傳說, 圖例"},{"s":325,"w":"LENGTH","p":"n","c":"長度","e":"1. MEASURE THE LENGTH OF THE JACK RAM.\n2. Make sure the differences between the extended length of the inner cylinder is not more than 2 inches (50.8mm)."},{"s":326,"w":"LENS","p":"n","c":"透鏡；鏡頭；晶體"},{"s":327,"w":"LIBERALLY","p":"adv","c":"不受限地"},{"s":328,"w":"LIFTABLE","p":"adv","c":"可舉起的","e":"1. Remove the collected debris around and below the liftable PDUs with a VACUUM CLEANER."},{"s":329,"w":"LIGHTING","p":"n","c":"照明","e":"1. A DIMMER UNIT CONTROLS THE PANEL LIGHTING.\n2. When you replace or install components on the lighting systems in a flammable leakage zone, seal these open items: - Lamp terminals - Terminal strips - Circuit breakers - Transformers - Switches - Hardwire - Wire junctions."},{"s":330,"w":"LIMIT","p":"n","c":"界線;界限","e":"1. IF THE CLEARANCES ARE NOT IN THE LIMITS GIVEN IN FIG. 4, REFER TO REPAIR SCHEME XXXX.\n2. 1.Observe these center of gravity limitations when you jack the aircraft:"},{"s":331,"w":"LINEAR","p":"adj","c":"線的,直線的","e":"1. MAKE SURE THAT THE RESULTS ARE LINEAR.\n2. The linear routing of the pipe is necessary."},{"s":332,"w":"LIQUID","p":"adj","c":"液體的;液態的","e":"1. DURING SERVICING, THE LIQUID OXYGEN FLOWS THROUGH THE STABILIZING CONTAINER.\n2. If the floor area of the galley area is not sealed correctly, liquid contamination can result in corrosion of the floor structure"},{"s":333,"w":"LITER","p":"n","c":"公升","e":"1. Container - 5 U.S. gallon (20 liter) capacity, suitable to collect oil drainage from IDG"},{"s":334,"w":"LITHIUM","p":"n","c":"鋰"},{"s":335,"w":"LOCAL","p":"adj","c":"區域的;局部的","e":"1. Look for local buckling, paint flakes, cracks and fasteners that are pulled or not there."},{"s":336,"w":"LOCATION","p":"n","c":"位置;場所","e":"1. FIGURES 1 THRU 4 SHOW THE LOCATION OF THE WALKWAYS.\n2. The taxi lights locate at nose landing gear."},{"s":337,"w":"LOCATOR","p":"n","c":"電波偵測器","e":"1. GET ACCESS TO UNDERWATER LOCATOR BEACON (ULB) BATTERY OF DFDR."},{"s":338,"w":"LONGITUDINAL","p":"adj","c":"長度的; 經度的","e":"1. ADJUST THE LONGITUDINAL TRIM SYSTEM."},{"s":339,"w":"LOOSEN","p":"v","c":"鬆開,解開","e":"1. Carefully loosen the swivel nut on the filler valve and slowly release the remaining pressure.\n2. Turn the nut until you feel that it is almost loose."},{"s":340,"w":"LOUVER","p":"n","c":"天窗","e":"1. Remove the louver and Perform Detail Visual Inspection for Removed Parts External Surface"},{"s":341,"w":"LUBE","p":"n","c":"潤滑油","e":"1. LUBRICATE THE LEFT INBOARD ELEVATOR HINGE BEARINGS.( 5 LUBE POINTS )"},{"s":342,"w":"LUBRICATE","p":"v","c":"使滑潤;給...上潤滑油","e":"1. LUBRICATE THE O-RINGS WITH HYDRAULIC FLUID (NATO H-515).\n2. Information, regarding airplane lubrication, such as item to be lubricated, lubricant to be used and method of application, is provided in Section 12-21-00."},{"s":343,"w":"MAGNETIC","p":"adj","c":"鐵的;磁性的","e":"1. Magnetic particle examination can be done only on materials with ferromagnetic properties, usually low alloy steels and heat-treatable stainless steels. It is a sensitive nondestructive procedure to find surface and near-surface cracks and discontinuiti"},{"s":344,"w":"MAGNIFIER","p":"n","c":"放大器"},{"s":345,"w":"MAINTENANCE","p":"n","c":"維修,保養","e":"1. DO NOT REFUEL THE AIRCRAFT DURING MAINTENANCE.\n2. Maintain fluid temperature at 70° F."},{"s":346,"w":"MALFUNCTION","p":"n","c":"發生故障;機能失常","e":"1. YOU MUST FIND AND DISCARD THE CENTER SECTION OF THE DIAPHRAGM FROM THE UNIT. IF THE CENTER SECTION OF THE DIAPHRAGM STAYS, IT CAN CAUSE A MALFUNCTION OF THE RESERVOIR.\n2. DO NOT PRESSURIZE AN ACCUMULATOR THAT HAS INTERNAL LEAKAGE. THIS CAN CAUSE NITROGEN TO GO INTO THE HYDRAULIC SYSTEM, AND A MALFUNCTION OF THE HYDRAULIC PUMP OR THE WHEEL BRAKE."},{"s":347,"w":"MANDATE","p":"v","c":"強制","e":"1. Note: FAA rules mandate that one mask minimum must be connected at all times to each portable oxygen cylinder assembly that is on an airplane for potential use."},{"s":348,"w":"MANDATORY","p":"adj","c":"命令的;強制的","e":"1. Sufficient stabilizing cables or ropes are mandatory to prevent the aircraft from shifting."},{"s":349,"w":"MANUAL","p":"adj","c":"用手操作的","e":"1. USE THE MANUAL CONTROLS IF THE AUTOMATIC CONTROLS DO NOT OPERATE.\n2. Manual Operation of the Precharge Shutoff Valve."},{"s":350,"w":"MANUALLY","p":"adv","c":"用手地","e":"1. Remove the Inbd Elevator Lock - SPL-5058 and manually hold the elevator in top up position."},{"s":351,"w":"MASTER","p":"v","c":"精通; 控制","e":"1. On the panel 125VU, make sure that the ENG MASTER switches are in the OFF position."},{"s":352,"w":"MATERIAL","p":"n","c":"材料,原料","e":"1. REMOVE THE UNWANTED MATERIAL BEFORE YOU INSTALL THE SEAL.\n2. Look for a white oxide material and blistered or melted plating. If the plating shows signs of heat damage, remove the components."},{"s":353,"w":"MATING","p":"adj","c":"相配","e":"1. APPLY GREASE ON THE MATING SURFACES OF THE STARTER GENERATOR.\n2. After you apply the adhesive, you have a maximum of 5 minutes to mate the repair parts(s). (After 5 minutes, the adhesive will get a thin, cured skin layer on it, that will make it difficult to get a good bond)."},{"s":354,"w":"MAXIMUM","p":"adj","c":"最大的;最多的","e":"1. The maximum pressure of the oxygen bottle is 1,850 psi.\n2. A maximum tolerance of 0.5 inch is permitted."},{"s":355,"w":"MEASURE","p":"v","c":"測量;計量","e":"1. Measure the oil quantities in the oil tank for proper services.\n2. If friction between the bolt and the hole is significant, and not taken into proper account, inaccurate measurement of the nut locking torque may result."},{"s":356,"w":"MECHANICAL","p":"adj","c":"機械的,用機械的","e":"1. DO NOT USE PRESSURIZED WATER, MECHANICAL TOOLS, OR PUT AN ALKALINE DETERGENT IN DRAIN LINES THAT HAVE A STRAINER. YOU CAN CAUSE DAMAGE TO THE STRAINER. USE THE SECTION OF TUBING BELOW THE STRAINER TO REMOVE THE BLOCKAGE.\n2. Corrosion can be removed by mechanical procedures or chemical procedures."},{"s":357,"w":"MECHANISM","p":"n","c":"機械裝置;機械作用","e":"1. BE PREPARED TO RE-INSTALL THE CAP ON THE FUEL STRAINER HOUSING AND CONTAIN ANY FUEL THAT CAN SPILL. IF THE SHUT-OFF MECHANISM FOR THE STRAINER HOUSING FAILS, FUEL FROM THE FUEL-FEED MANIFOLD CAN DRAIN THROUGH THE STRAINER HOUSING PORT.\n2. Lift the handle of the tow bar lock mechanism."},{"s":358,"w":"MEDICAL","p":"adj","c":"醫術的;醫療的","e":"1. IF YOU GET HYDRAULIC FLUID IN YOUR EYES, FLUSH THEM WITH WATER AND GET MEDICAL AID."},{"s":359,"w":"MELT","p":"v","c":"融化","e":"1. THE FUSIBLE PLUGS MUST MELT IN 20 SECONDS OR LESS."},{"s":360,"w":"MICROWAVE","p":"n","c":"微波"},{"s":361,"w":"MIDDLE","p":"adj","c":"中部的,中間的","e":"1. REMOVE THE MIDDLE BELLCRANK UNIT."},{"s":362,"w":"MIGRATION","p":"n","c":"遷移","e":"1. PLEASE DETAIL INSPECTION OF R/H INBOARD FOREFLAP CENTER TOGGLE FITTING BEARING HAVE ANY MIGRATION OR ABNORMAL CONDITION."},{"s":363,"w":"MINIMUM","p":"adj","c":"最小的,最少的","e":"1. MAKE SURE THAT THE FLUID IN THE HYDRAULIC RESERVOIR IS ABOVE THE MINIMUM LEVEL.\n2. Tighten the ignitor plug to minimum 360 pound-inches."},{"s":364,"w":"MINUS","p":"prep","c":"減(去)","e":"1. INCREASE THE PRESSURE IN THE SHOCK ABSORBER TO 85.5 BAR, PLUS OR MINUS 2.7 BAR."},{"s":365,"w":"MIRROR","p":"n","c":"鏡子","e":"1. MIRROR & MAGNIFYING LENS MAY BE REQUIRED."},{"s":366,"w":"MISSING","p":"adj","c":"失蹤的;找不到的","e":"1. IF THE SEALS ARE MISSING, DISCARD THE PART."},{"s":367,"w":"MIXTURE","p":"n","c":"混合物;混合料","e":"1. DO NOT USE THIS MIXTURE WHEN THE TEMPERATURE IS LESS THAN 15° C.\n2. DO NOT MIX OILS OF DIFFERENT TYPES OR BRAND NAMES. SOME OILS WILL CHEMICALLY CHANGE WHEN YOU MIX THEM. THIS CAN CAUSE DAMAGE TO THE EQUIPMENT."},{"s":368,"w":"MOBILE","p":"adj","c":"機動的"},{"s":369,"w":"MODE","p":"n","c":"形式,狀態;種類","e":"1. MAKE SURE THAT THE “HEADING SELECT” MODE OPERATES."},{"s":370,"w":"MODERATE","p":"adj","c":"中等的,適度的","e":"1. APPLY A MODERATE LOAD ON THE BRAKE PEDALS."},{"s":371,"w":"MODULE","p":"n","c":"(航天器的)艙; 組件; 單元","e":"1. Set the INBD CRT and LWR CRT switches on the captain's display transfer module to the NORM position."},{"s":372,"w":"MOIST","p":"adj","c":"潮濕的,微濕的","e":"1. Clean the control cable with a brush or clean cloth moist with solvent.\n2. Moisten the cloth with MEK."},{"s":373,"w":"MOMENTARILY","p":"adv","c":"短暫地","e":"1. STOP THE PUMP MOMENTARILY. THEN START IT AGAIN."},{"s":374,"w":"MONITOR","p":"v","c":"監控;監聽","e":"1. Monitor the hydraulic pressure and make sure the hydraulic quantities not below 0.75.\n2. During a refuel operation, continuously monitor the airplane for fuel leaks and fuel spills at the wingtip vent ports."},{"s":375,"w":"MOUNT","p":"n","c":"底座、托板","e":"1. At the interface of the waste flap mount and the waste chute."},{"s":376,"w":"MOVABLE","p":"adj","c":"可動的,可移動的","e":"1. TURN THE MOVABLE HALF-COLLAR OF THE SUPPORT."},{"s":377,"w":"MOVEMENT","p":"n","c":"運動、運轉、動作","e":"1. MOVEMENT OF COMPONENTS CAN KILL OR INJURE PERSONS"},{"s":378,"w":"MULTIPLY","p":"v","c":"乘,使相乘","e":"1. MULTIPLY THE INDICATOR VALUE BY THE SCALE VALUE."},{"s":379,"w":"NACELLE","p":"n","c":"(飛機、飛船)的引擎艙; 吊艙; 氣球吊籃","e":"1. NACELLE STRUT ACCESS PANELS - MAINTENANCE PRACTICES"},{"s":380,"w":"NECESSARY","p":"adj","c":"必要的,必需的","e":"1. IF NECESSARY, TURN THE FITTING."},{"s":381,"w":"NEUTRAL","p":"adj","c":"中立的;中性的","e":"1. MAKE SURE THAT THE CONTROLS ARE IN THE NEUTRAL POSITION.\n2. Clean the surface with the neutral solution."},{"s":382,"w":"NIPPLE","p":"n","c":"突狀接頭","e":"1. When using the special grease gun with extended nipple and 45-degree bend to lubricate the hinges, remove only the two outboard hinge covers on the outboard elevator to access those lubrication points."},{"s":383,"w":"NORM","p":"n","c":"基準"},{"s":384,"w":"OBEY","p":"v","c":"服從;遵守","e":"1. OBEY THE PRECAUTIONS THAT FOLLOW.\n2. Obey the instructions that illustrated in the maintenance manual."},{"s":385,"w":"OBSCURING","p":"adj","c":"暗的;模糊的","e":"Remove all obscuring systems, equipment, material and furnishings to allow access to the area to be inspected."},{"s":386,"w":"OBVIOUS","p":"adj","c":"明顯的;顯而易見的","e":"1. Confirm the cleaner is stored in container and that has obvious color and tag."},{"s":387,"w":"OCCUR","p":"v","c":"發生","e":"1. A SUDDEN MOVEMENT OF THE CONTROLS CAN OCCUR."},{"s":388,"w":"OIL LINE","p":"n","c":"油管","e":"1. \"Scavenge filter inspection is a check to see if it is necessary to replace the cooler and oil lines.\""},{"s":389,"w":"OILY","p":"adj","c":"(含)油的；油污；塗油的","e":"1. \"Replace the insulation blanket if there is Corrosion-Inhibiting-Compound (CIC)contamination, oily or waxy substances or other fluids (which typically changes thecolor and appearance of the insulation blanket cover).\""},{"s":390,"w":"OPERATE","p":"v","c":"運作;運轉","e":"1. OPERATE THE PLUNGER TO DRAIN THE SYSTEM."},{"s":391,"w":"OPPOSITE","p":"adj","c":"相反的,對立的","e":"1. Remove the cotter pin, nut and washer from the opposite end of the connecting rod."},{"s":392,"w":"OPTIONAL","p":"adj","c":"選擇性的","e":"1. It is optional to tow the airplane with the entry doors, the upper and lower cargo doors, and/or the nose loading cargo door (if it is applicable) open.\n2. If you have the option, do the inspection in daylight."},{"s":393,"w":"ORGANIC","p":"adj","c":"有機物的"},{"s":394,"w":"OUTBOARD","p":"adj","c":"在外部","e":"1. MEASURE THE MOVEMENT OF THE INBOARD AND OUTBOARD FLAPS."},{"s":395,"w":"OVERBOARD","p":"adv","c":"向艙外","e":"1. RELEASE THE AIR OVERBOARD."},{"s":396,"w":"OVERHEAD","p":"n","c":"在上頭的;高架的","e":"1. Make sure the APU control switch on the P5 overhead panel is OFF and attach a DO-NOT-OPERATE tag."},{"s":397,"w":"OVERRIDE","p":"v","c":"撤銷,取代","e":"1. In flight, with the system in override mode, cooling air is exhausted overboard through the smoke/override valve. The smoke/override valve is a 28 volt dc motor-operated butterfly valve.\n2. DO NOT KEEP THE EQUIP COOLING SWITCH IN THE OVRD POSITION FOR MORE THAN FIVE MINUTES. EXTENDED OPERATION OF AIRPLANE SYSTEMS WITHOUT COOLING AIRFLOW CAN RESULT IN DAMAGE TO EQUIPMENT."},{"s":398,"w":"OZONE","p":"n","c":"臭氧"},{"s":399,"w":"PALLET","p":"n","c":"(裝卸、搬運貨物用的)托盤"},{"s":400,"w":"PARAGRAPH","p":"n","c":"段落","e":"1. Remove the reservoir for servicing (Ref Remove the Reservoir paragraph)."},{"s":401,"w":"PARENTHESES","p":"n","c":"括弧, 插入語","e":"1. NOTE: This test is for the Captain station. For the other stations, use the indications between the parentheses."},{"s":402,"w":"PARKING","p":"n","c":"停放","e":"1. Make sure the parking brake is set."},{"s":403,"w":"PARTICLE","p":"n","c":"微粒;顆粒","e":"1. The dust particles can have different dimensions.\n2. If you find metal particles in the oil filter,replace the filter."},{"s":404,"w":"PASTE","p":"n","c":"糊,膏","e":"1. MIX THE MATERIALS UNTIL THEY MAKE A PASTE."},{"s":405,"w":"PATCH","p":"n","c":"補釘,補片;","e":"1. REPAIR THE HOLE IN THE TUBE WITH A PATCH."},{"s":406,"w":"PATH","p":"n","c":"通路"},{"s":407,"w":"PATTERN","p":"n","c":"花樣, 圖案","e":"1. Replace the solid drive-wheel tire if all the tread pattern is fully worn off. This includes the tread that extends not fully down the side of the tire"},{"s":408,"w":"PERFORMANCE","p":"n","c":"實行;性能","e":"1. SOME REPAIRS CAN DECREASE THE PERFORMANCE OF THE ENGINE."},{"s":409,"w":"PERMANENT","p":"adj","c":"永久的,永恆的","e":"1. If you cannot install the permanent fasteners before the pot life of the sealing compound ends, use temporary fasteners to hold the parts together until the sealing compound dries."},{"s":410,"w":"PERMITTED","p":"adj","c":"被允許的","e":"1. A MAXIMUM OF TWO WASHERS IS PERMITTED FOR EACH BOLT.\n2. Do not permit a shock strut to have less than 1 inch (25.4mm) of extension (visible chrome), measured from the lower surface of the shock strut outer cylinder."},{"s":411,"w":"PILLOW","p":"n","c":"[機]軸枕，墊座"},{"s":412,"w":"PINION","p":"n","c":"小齒輪","e":"1. LUBRICATION OF L/H SLAT TRACK ROLLER BEARINGS, PINION BEARINGS,PINION AND RACK TEETH AND SLAT TRACK 2 AND 3 LEVER BEARINGS."},{"s":413,"w":"PITTING","p":"n","c":"金屬表面的腐蝕","e":"1. Galvanic corrosion may result with pitting or other damage occuring in the higher potential material."},{"s":414,"w":"PLATFORM","p":"n","c":"平台"},{"s":415,"w":"PLUNGER","p":"n","c":"活塞"},{"s":416,"w":"PNEUMATIC","p":"adj","c":"氣動的","e":"1. The pneumatic source can be provided from the engines, APU, or the ground cart."},{"s":417,"w":"POLISH","p":"v","c":"磨光,擦亮","e":"1. POLISH THE WINDOW PANE WITH A SOFT CLOTH.\n2. Polish aircraft exterior with wax."},{"s":418,"w":"POSITION","p":"n","c":"位置;地點","e":"1. SET THE SWITCH TO THE CORRECT POSITION."},{"s":419,"w":"POSSIBLE","p":"adj","c":"可能的","e":"1. IF POSSIBLE, PUT THE RIGGING PIN IN THE HOLE."},{"s":420,"w":"POWER PLANT","p":"n","c":"動力裝置；發動機","e":"1. Power Plant Test Reference Table (P/B 501)2.(4056B4-PAGE 9OF 10 ). Do applicable test shown in the Power Plant Test Reference Table(TASK 71-00-00- 700-801-J00)"},{"s":421,"w":"PRECAUTION","p":"n","c":"預防措施","e":"1. When you disconnect tubing, always obey necessary precautions to prevent leakage of the fluids"},{"s":422,"w":"PRECHARGE","p":"v","c":"預先儲存","e":"1. PRESSURE CHECK BRAKE SURGE ACCUMULATOR PRECHARGER."},{"s":423,"w":"PREPARE","p":"v","c":"準備;籌劃","e":"1. Prepare one container, with two quarter capacity, to collect contaminated oil.\n2. Mixture preparation must be accomplished 20 minutes before use."},{"s":424,"w":"PRESSURIZE","p":"v","c":"加壓於","e":"1. Pressurize the right hydraulic system to set the parking brake.\n2. Do this task to pressurize hydraulic systems No. 1 and 4 or 2 and 3: \"Hydraulic System Pressuriztion\""},{"s":425,"w":"PRIMARY","p":"adj","c":"首要的,主要的","e":"1. THE PRIMARY FUNCTION OF THE POWER UNIT IS TO SUPPLY ELECTRICAL POWER TO THE AIRCRAFT. 3.Zones are used to identify different areas of the aircraft. Each zone contains three numbers.\n2. Before you start working on the primary flight controls,make sure all of the hydraulic power be removed."},{"s":426,"w":"PRIOR","p":"adj","c":"優先的;在前的","e":"1. Ventilate and dry any wet insulation blankets prior to re-installing, or replace with new, as necessary."},{"s":427,"w":"PROBLEM","p":"n","c":"問題,疑難問題","e":"1. IF YOU FIND A PROBLEM, REFER TO THE TROUBLESHOOTING MANUAL."},{"s":428,"w":"PROCEDURE","p":"n","c":"程序;步驟","e":"1. Make sure to do the corrective deactivation procedure.\n2. During the tow procedure, an approved person must be in the flight compartment to look for dangerous conditions and stop the aircraft if necessary."},{"s":429,"w":"PROCURABLE","p":"adj","c":"可實現的;可獲得的","e":"1. \"When more than one tool part number is listed under the same \"\"Reference\"\" number, the tools shown are alternates to each other within the same airplane series. Tool part numbers that are replaced or non-procurable are preceded by \"\"Opt:\"\"."},{"s":430,"w":"PROGRESS","p":"n","c":"前進；行進","e":"1. Make sure IN PROGRESS is shown on the CMC CDU."},{"s":431,"w":"PROOF","p":"n","c":"防阻","e":"1. THE ELECTRICAL EQUIPMENTS SHOULD BE EXPLOSING-PROOF TYPE."},{"s":432,"w":"PROPERTY","p":"n","c":"特性,性能","e":"1. THE PROPERTIES OF THESE MATERIALS PREVENT CORROSION."},{"s":433,"w":"PROPORTION","p":"n","c":"比例;比率","e":"1. MAKE SURE THAT YOU USE CORRECT PROPORTIONS OF CLEANING AGENTS AND COLD WATER.\n2. The cable tension changes proportionally with temperature."},{"s":434,"w":"PROTECTION","p":"n","c":"保護,防護","e":"1. APPLY TWO LAYERS OF SEALING COMPOUND ON THE SURFACES THAT HAVE NO PROTECTION.\n2. Do not apply corrosion inhibiting compounds on bearings to protect the drive shaft."},{"s":435,"w":"PROTECTIVE","p":"adj","c":"保護的,防護的","e":"1. Adequate protective clothing should be worn when handling or working in acid contaminated areas.\n2. When the protective finish is cracked, chipped, or deteriorated, the first line of defense against corrosion is broken, and the structure is subject to attack."},{"s":436,"w":"PUSHROD","p":"n","c":"推桿"},{"s":437,"w":"QUALITY","p":"n","c":"品質","e":"1. THE CLEANING SOLVENT MUST BE OF GOOD QUALITY."},{"s":438,"w":"QUANTITY","p":"n","c":"量;數量","e":"1. If only small quantities of fluid are necessary, you can use fluid without lubricant to fill the shock strut.\n2. The oil quantity indication is shown on the lower display unit."},{"s":439,"w":"RACK","p":"n","c":"架子; 掛物架; 齒條; 裝配齒輪之齒棒","e":"1. The E30 electrical equipment rack can be found forward of the E/E bay on the right side of the nose gear wheel well"},{"s":440,"w":"RADIAL","p":"adj","c":"徑向的","e":"1. The maximum radial out of alignment tolerance is 0.0312 in (0.800 mm) for each 10.00 in (25.4 cm) of pipe length.\n2. If the axial play is between 0.023 and 0.045 inch, measure the permitted radial shaft play."},{"s":441,"w":"RADIOACTIVE","p":"adj","c":"放射性的","e":"1. DO A CHECK FOR RADIOACTIVE CONTAMINATION."},{"s":442,"w":"RAFT","p":"n","c":"(救生用)橡皮艇"},{"s":443,"w":"RAMP","p":"n","c":"斜面、坡道"},{"s":444,"w":"RANDOM","p":"adj","c":"隨機的","e":"1. DO RANDOM CHECKS OF THE TIRE PRESSURE DURING THIS PROCEDURE.\n2. If broken wires are isolated or random, make a log book entry to look for further damage in this area at the next scheduled maintenance check."},{"s":445,"w":"RANGE","p":"n","c":"幅度;範圍","e":"1. MOVE THE EQUIPMENT AWAY FROM THE RANGE OF TRAVEL OF THE FLAPS.\n2. Examine the accumulator pressure gage (4). Make sure the pointer is in the green range."},{"s":446,"w":"RATE","p":"n","c":"比例;比率","e":"1. MAKE SURE THAT THE RATE IS NOT MORE THAN 10 DEG. PER SECOND.\n2. Open the water supply valve. Make sure that the water pressure is 25-35 psi (1738-241.33 kPa) and flow rate at 10-15 gpm (37.85-56.78 lpm)."},{"s":447,"w":"RAW","p":"adj","c":"未加工的"},{"s":448,"w":"RAY","p":"n","c":"光線"},{"s":449,"w":"REAR","p":"adj","c":"後面;背後","e":"1. Apply the ice-preventative compound DPM 209 with an acid brush to the cable pressure seals and grommets in the wing-rear spar areas, the main landing gear, and nose landing gear wheel wells.\n2. Do not tow the aircraft if the nose gear static strut extends more than the \"X\" dimension specified on the strut instruction plate. The instruction plate is on the left rear nose gear door. Deflate the shock strut to the specified range, if necessary."},{"s":450,"w":"RECEIVE","p":"v","c":"收到,接到","e":"1. Fuel can be transferred from all tanks. Make sure the tank to receive the fuel has space available. Refer to the fuel transfer schematic.\n2. The HF radios are used to talk to and receive messages from other aircraft and ground stations in the 000 to 29.999 MHz frequency range. The VHF radios are used to talk to and receive messages from other aircraft and ground stations in the 118.000 to"},{"s":451,"w":"RECEPTION","p":"n","c":"接待, 接受,","e":"1. All the pushbutton switches for reception are pushed."},{"s":452,"w":"RECOMMEND","p":"v","c":"推薦;建議","e":"1. It is recommanded to use the contact cleaner to clean the electrical connectors.\n2. Align strap on to the fastener with smooth bend and avoid kinking the ground strap, and torque assembly to manual recommendation."},{"s":453,"w":"RECONDITION","p":"n","c":"重建","e":"1. 73X RECONDITIONER OR VVL800 OR EQUIVALENT OIL TO LUBRICATE B/C SEAT READING LIGHT HOSE AND BASE."},{"s":454,"w":"REFER","p":"v","c":"查閱,參考","e":"1. If there is structural damage to the aft fuselage, refer to the MD-11 Structural Repair Manual (SRM). The SRM has the approved structural damage limits and repair procedures.\n2. The aircraft is divided into reference points designated as station numbers."},{"s":455,"w":"REFLECTION","p":"n","c":"反射;回響","e":"1. The mirror is found on the entry door to the flight compartment. It is attached to the forward side of the door. The mirror lets the crew see their reflection.\n2. When smoke goes through the detector, it causes a reflection of the light from the LED to the photocell. This reflection increases the output voltage of the photocell. When this occurs, the logic circuit in the smoke detector compares the photocell vol"},{"s":456,"w":"REFUEL","p":"v","c":"補給燃料","e":"1. The aircraft has four pressure refuel/defuel adapters. There are two in each wing. The adapters are found near the No. 1 and 3 engine pylons on the lower surface of each wing.\n2. The aircraft can refuel without external power or auxiliary power unit power with the static inverter. A switch, located on the right wing refuel panel (under the wing and outboard of the No. 3 engine), also controls the static inverter."},{"s":457,"w":"REGULAR","p":"adj","c":"規則的;固定的","e":"1. Oil system replenishment includes the servicing procedures necessary at regular intervals for the general prevention of damage to the aircraft.\n2. The ice is not always fully melted if fuel drains satisfactorily after a short-time temperature increase. Ice at the valve-drain-head can melt but ice can stay at other points in the tank."},{"s":458,"w":"REJECT","p":"v","c":"拒絕;退回","e":"1. Small dents which can occur to the tubing (up to 0.06 inch depth) are permitted. But cracks or bent or twisted sections in the tubing are a cause to reject them.\n2. Rejection is mandatory if the test proves the equipment to be defective."},{"s":459,"w":"RELATED","p":"adj","c":"有關的,相關的","e":"1. CLEAN THE BALLS OF THE ELECTRICAL LATCH AND ITS RELATED SOCKETS.\n2. THE RELATION BETWEEN THE TWO CONTROL SYSTEMS KEEPS THE AIRCRAFT STABLE."},{"s":460,"w":"REMAINING","p":"adj","c":"剩餘的","e":"1. LOOSEN THE CONNECTION SLOWLY. THE REMAINING OXYGEN CAN RELEASE WITH A LARGE FORCE, AND CAUSE THE TEMPERATURE TO INCREASE. HEAT AND OXYGEN CAN CAUSE A FIRE. INJURIES TO PERSONNEL, AND DAMAGE TO EQUIPMENT CAN OCCUR.\n2. Use compressed air to remove the remaining solvent from the area."},{"s":461,"w":"REPLACE","p":"v","c":"更換","e":"1. Four spare shear bolts are kept on the tow bar. When you replace the shear bolts, use AN9-57A bolts and NAS1022C9 nuts. Tighten the nuts 50 to 100 pound-inches.\n2. This subject provides a list of airplane systems filters that require scheduled cleaning or replacement."},{"s":462,"w":"REPOSITION","p":"n","c":"貯藏；放回","e":"1. IF ROLLERS CAN NOT BE COMPLETELY ROTATED THEN REPOSITION FLAP SETTING TO ENABLE INSPECTION OF THE ENTIRE ROLLER SURFACE."},{"s":463,"w":"RESOURCE","p":"n","c":"資源"},{"s":464,"w":"RESULT","p":"n","c":"結果;成果","e":"1. IF THESE TESTS DO NOT GIVE THE CORRECT RESULTS, REPLACE THE UNIT.\n2. Incorrect connection will result in damage."},{"s":465,"w":"RETENTION","p":"n","c":"保持","e":"1. Make sure the keeper eye bolt does not turn and the retension pin is not broken."},{"s":466,"w":"RETRACT","p":"v","c":"撤回,收回","e":"1. DO NOT GO INTO THE WING LEADING EDGE AREAS BEFORE YOU INSTALL THE SAFETY LOCKS. THE LEADING EDGE FLAPS WILL RETRACT IN 7 SECONDS. PUT LOCKS ON ALL LEADING EDGE FLAPS THAT ARE EXTENDED. THIS WILL PREVENT INJURY TO PERSONS FROM ACCIDENTAL FLAP OPERATION.\n2. The aircraft has a retractable landing gear."},{"s":467,"w":"RETRACTION","p":"n","c":"收縮;收縮力","e":"1. DURING THE RETRACTION SEQUENCE, MAKE SURE THAT THE LANDING GEAR DOORS CLOSE.\n2. Open the circuit breaker to prevent the spoiler retraction."},{"s":468,"w":"RETROFIT","p":"n","c":"(飛機等的)翻新"},{"s":469,"w":"REVISION","p":"n","c":"修訂;修正","e":"1. Program evaluation of corrosion, and revision of the program schedule and procedures, and reporting of corrosion Level 2 or 3 is required."},{"s":470,"w":"RIB","p":"n","c":"翼肋","e":"1. BRACKET IS ATTACHED TO STABILIZER TRAILING EDGE BELOW RIB OUTBOARD OF POWER CONTROL PACKAGE."},{"s":471,"w":"ROD","p":"n","c":"棒;桿;竿","e":"1. Connect the two hold-open rods from the left access door to the two brackets and install the two quickrelease pins."},{"s":472,"w":"ROUGH","p":"adj","c":"粗糙的,粗略的","e":"1. CLEAN THE ROUGH SURFACES CAREFULLY.\n2. Make sure the area of the bond has sufficient roughness."},{"s":473,"w":"ROUNDED","p":"adj","c":"圓的","e":"1. WHEN YOU INSTALL THE PART, MAKE SURE THAT THE ROUNDED EDGE IS AGAINST THE STRUCTURE.\n2. The usual damages to the piping are sharp bottom dents, rounded bottom dents and flat bottom dents. Also nicks, die tears, seams, scratches, grooves, folds, pits and holes."},{"s":474,"w":"RUBBER","p":"n","c":"橡膠; 合成橡膠","e":"1. USE GOGGLES AND RUBBER GLOVES WHEN YOU WASH THE FILTER. WASH THE FILTER IN A WELL VENTILATED AREA. THE CLEANER CAN IRRITATE YOUR EYES, SKIN,THROAT AND LUNGS.\n2. DO NOT LET THE OIL GET ON THE IDG OR OTHER COMPONENTS. IMMEDIATELY CLEAN THE OIL WHEN IT FALLS ON THEM. OIL CAN CAUSE DAMAGE TO PAINT AND RUBBER."},{"s":475,"w":"RUDDER","p":"n","c":"方向舵","e":"1. Push the toe of the rudder pedals fully and pull on the parking brake lever on the control stand.\n2. To release the parking brake, apply toe pressure on the rudder pedals and then release the toe pressure."},{"s":476,"w":"RUST","p":"n","c":"鏽","e":"1. USE WIPER PAPER TO CLEAN THE TORQUE TUBE BEARING SURROUNDINGS FOR RUSTY OR CONTAMINATED CONDITION.\n2. Inspect the grease that comes out of the ballnut for signs of metallic debris, discolored water, rust, or other harmful particles. If any of these items are in the grease, replace the stabilizer trim drive mechanism."},{"s":477,"w":"SACHET","p":"n","c":"密封小袋","e":"1. \"When the display surface is clean, use a clean, dry area of the cloth or the dry sachet in a straight linefrom top to bottom to carefully dry the display surface.\""},{"s":478,"w":"SATISFACTORY","p":"adj","c":"令人滿意的;符合要求的","e":"1. A CLEARANCE OF 3 mm IS SATISFACTORY.\n2. REPLACE THE CAP IF ITS CONDITION IS NOT SATISFACTORY."},{"s":479,"w":"SCALLOPED","p":"adj","c":"扇形邊的","e":"1. THE BAYONET MCD PROBE (SCALLOPED OR KNURLED KNOB) ATTACHES TO THE HOUSING BY BAYONET PINS AND SLOTS."},{"s":480,"w":"SCATTER","p":"v","c":"消散; 分散; 散播","e":"1. If the scavenge filter element shows a number of moderately scattered, small metallic flakes (bronze or silver colored metal) or flakes of generator insulation, these by-products are the results of normal IDG operation."},{"s":481,"w":"SCAVENGE","p":"v","c":"排除廢氣;清除污物;在…搜尋有用之物","e":"1. Scavenge filter inspection is a check to see if it is necessary to replace the cooler and oil lines."},{"s":482,"w":"SCHEDULE","p":"v","c":"將...列入計劃(或時間)表","e":"1. WE RECOMMEND THAT YOU SCHEDULE THE MAINTENANCE CAREFULLY.\n2. Regularly scheduled maintenance is vital to prevent corrosion."},{"s":483,"w":"SEAL","p":"n","c":"密封墊","e":"1. Replace the wheel bearing seal if it is damaged.\n2. MAKE SURE THE NOSE GEAR WHEELS ARE ALIGNED WITH THE MAIN LANDING GEAR WHEELS. THIS WILL HELP DECREASE TIRE AND STRUT STRESSES. THESE STRESSES CAN CAUSE HYDRAULIC LEAKS THROUGH THE SHOCK STRUT SEAL."},{"s":484,"w":"SECONDARY","p":"adj","c":"次要的;輔助的","e":"1. The turbine inlet over-temperature fusible plug also monitors the turbine inlet temperature and supplies secondary overheat protection.\n2. Some metal-seal fittings have an O-ring and a backup ring. The metal-seal fittings with the secondary seal are identified with notches on the edge of the hex flats."},{"s":485,"w":"SELECTION","p":"n","c":"選擇","e":"1. The cabin temperature control module on the P5 pilots' overhead panel permits selection of flight deck temperature and passenger compartment master temperature, provides indication of a closed master trim air shutoff valve.\n2. Select the proper wrench adapter and connect to the torque wrench."},{"s":486,"w":"SEMICIRCULAR","p":"adj","c":"半圓的","e":"1. The fill check valve has a valve body, and two semicircular flappers attached to a hinge pin across the valve port. When fuel goes into the fill tube from the fill shutoff valve, the fuel pressure pushes the flappers open. Fuel then flows into the fuel\n2. A semicircular arm splined to the drive shaft is connected by a drive link and arm to the drum shaft, which is also mounted in bearings in the rail. The drum shaft is bolted to the slat drive drum, which turns on the pivot mount on the structure."},{"s":487,"w":"SENSITIVE","p":"adj","c":"易受損的","e":"1. DO NOT TOUCH THE ELECTRICAL CONNECTOR CONTACT PINS. STATIC ELECTRICAL CHARGES THAT COLLECT ON THE SKIN CAN CAUSE DAMAGE TO THE ELECTROSTATIC SENSITIVE COMPONENTS INSTALLED IN THIS DEVICE.\n2. Electrostatic sensitive parts and equipment are identified so that you will know that they are subjected to damage by electrostatic discharge (ESD). The identification symbols, labels, etc., are used on units, components, and their packages to prevent"},{"s":488,"w":"SEPARATION","p":"n","c":"分開;分離","e":"1. SEPARATION OF THESE PARTS IS NOT EASY.\n2. The water separator separates the water from the conditioned air."},{"s":489,"w":"SEQUENCE","p":"n","c":"次序;順序;先後","e":"1. TIGHTEN THE BOLTS IN THE SEQUENCE GIVEN IN FIG. 3.\n2. When you adjust the cable tension,obey the sequence of the steps."},{"s":490,"w":"SERIES","p":"n","c":"系列;連續","e":"1. \"THE TOOLS SHOWN ARE ALTERNATES TO EACH OTHER WITHIN THE SAME AIRPLANE SERIES.\""},{"s":491,"w":"SERRATION","p":"n","c":"鋸齒狀;鋸齒狀突起","e":"1. MAKE MARKS THAT SHOW THE LOCATION OF THE SERRATIONS ON THE PLATES.\n2. Use gloves when handling parts with serrated edges."},{"s":492,"w":"SERVICEABLE","p":"adj","c":"可用的;可供使用的","e":"1. PUT THE SYSTEM BACK TO THE SERVICEABLE CONDITION.\n2. BEFORE INSTALLATION, MAKE SURE THAT THE UNIT IS SERVICEABLE."},{"s":493,"w":"SERVICING","p":"n","c":"檢修,維修,保養","e":"1. A wing fuel imbalance condition is when the aircraft has a fuel imbalance of more than permitted in the fuel servicing procedure as specified in PRESSURE REFUELING, SUBJECT 12-11-02 ."},{"s":494,"w":"SERVOVALVE","p":"n","c":"伺服阀","e":"1. NORMAL BRAKE SERVOVALVE MANIFOLD ASSEMBLY"},{"s":495,"w":"SET UP","p":"n","c":"建立"},{"s":496,"w":"SHAKE","p":"v","c":"搖動;震動","e":"1. You do not need to pull on the wire bundles, shake the wire bundles, or disconnect the connectors to perform this inspection.\n2. DO NOT LET THE FILTER TOUCH YOUR SKIN. DO NOT SHAKE OR HIT THE FILTER. DO NOT LET THE FILTER FALL. DO NOT USE COMPRESSED AIR TO CLEAN THE FILTER OR FILTER HOUSING. THIS CAN CAUSE THE INFECTIOUS MATERIAL TO BECOME AIRBORNE."},{"s":497,"w":"SHAPE","p":"n","c":"形狀;外形","e":"1. THE PATCH MUST BE THE SAME SHAPE AS THE CUTOUT.\n2. MAKE SURE YOU OPERATE THE APPLICABLE AIR CONDITIONING PACK FOR A MINIMUM OF 30 MINUTES DURING THE TEST OF THE PACK. THIS WILL CAUSE THE HOSE MATERIAL TO BECOME THE CORRECT SHAPE."},{"s":498,"w":"SHARP","p":"adj","c":"銳利地","e":"1. The lockwire must not have kinks, cuts or sharp edges at the ends. Twist the lockwire clockwise on connectors, nuts and bolts that tighten clockwise. Twist the lockwire counterclockwise on connectors, nuts and bolts that tighten counterclockwise.\n2. DO NOT USE SHARP TOOLS TO REMOVE THE PROTECTIVE PAPER. SHARP TOOLS CAN CAUSE DAMAGE TO THE ACRYLIC MATERIAL SURFACE WHEN YOU REMOVE THE PROTECTIVE PAPER."},{"s":499,"w":"SHEET","p":"n","c":"表單，表格"},{"s":500,"w":"SHELF","p":"n","c":"架子","e":"1. \" PERFORM AN OPERATIONAL CHECK OF THE E/E COOLING SYSTEM E30-2 SHELF.\""},{"s":501,"w":"SHIPPING","p":"v","c":"運送","e":"1. Special cleaning is necessary after seafood/wet cargo shipping if leakage rom the shipping container occured."},{"s":502,"w":"SHUTDOWN","p":"n","c":"關門；停工","e":"1. DO NOT LET HOT OIL TOUCH YOU. LET 5 MINUTES GO BY AFTER AN ENGINE SHUTDOWN TO LET THE OIL SYSTEM PRESSURE GO TO ZERO."},{"s":503,"w":"SIDESTAY","p":"n","c":"側定位","e":"1. Make sure that the tension springs (1) are correctly attached to the sidestay and the lockstay."},{"s":504,"w":"SILL","p":"n","c":"門檻"},{"s":505,"w":"SILVER","p":"n","c":"銀"},{"s":506,"w":"SIMULATE","p":"v","c":"模擬","e":"1. Perform the ' simulate in air' procedures to test the flap load relief functions.\n2. Open the circuit breakers that follow to simulate no flow condition."},{"s":507,"w":"SLAT","p":"n","c":"前緣襟翼"},{"s":508,"w":"SLIVER","p":"n","c":"裂片、細片"},{"s":509,"w":"SLOTS","p":"n","c":"狹縫","e":"1. Turn the MCD probe clockwise to engage the pins in the slots."},{"s":510,"w":"SMOOTH","p":"adj","c":"光滑地,平滑地","e":"1. MAKE SURE THAT THE PAINTED SURFACE IS SMOOTH.\n2. Make sure that the tip of the tool move smoothly on the reduction gear shaft."},{"s":511,"w":"SOAK","p":"v","c":"浸泡, 浸漬","e":"1. To prevent scratches on the surface, soak the brushes in the cleaner before you use them.\n2. Soak and flush the cloth in water, wring it out, then fully-rub the area again to remove any detergent that stays."},{"s":512,"w":"SOURCE","p":"n","c":"根源;來源","e":"1. OPERATE THE SWAGING TOOL WITH A HYDRAULIC SOURCE.\n2. The alternate brake source comes from the center hydraulic system."},{"s":513,"w":"SPARK","p":"n","c":"火花,火星","e":"1. Remove all spark-producing equipment from the area. Spark-producing equipment includes electrically-powered tools, vacuum cleaners, and electronic test equipment.\n2. The maintenance area must not be downwind of any building where fuel fumes may collect, or any open flame, or spark producing equipment."},{"s":514,"w":"SPECIFIED","p":"adj","c":"指定的","e":"1. INFLATE THE TIRE WITH NITROGEN TO THE SPECIFIED PRESSURE.\n2. Do not tighten the fasteners more than the specified torque of the engine manual."},{"s":515,"w":"SPHERICAL","p":"adj","c":"球的;球面的","e":"1. THE ACCUMULATORS ARE SPHERICAL AND HAVE BLADDERS.\n2. When you have the trunnion pin and the spherical bearing correctly aligned, the trunnion pin will be very easy to install."},{"s":516,"w":"SPILL","p":"v","c":"溢出","e":"1. IF YOU SPILL THE ELECTROLYTE, YOU MUST REMOVE IT IMMEDIATELY.\n2. After acid spillage, clean the area."},{"s":517,"w":"SPINDLE","p":"n","c":"軸，心軸","e":"1. AFTFLAP FITTING OF AFTFLAP ARM AND SPINDLE YOKE FITTING (Page 7 : Figure 30 Inboard Trailing Edge Flap Foreflap, Midflap, and Aftflap Servicing (Lubrication) (Sheet 1))"},{"s":518,"w":"SPINDLE YOKE","p":"n","c":"飛行操縱桿；偏轉線圈；","e":"1. AFTFLAP FITTING OF AFTFLAP ARM AND SPINDLE YOKE FITTING (Page 7 : Figure 30 Inboard Trailing Edge Flap Foreflap, Midflap, and Aftflap Servicing (Lubrication) (Sheet 1))"},{"s":519,"w":"SPOT","p":"n","c":"斑點;汙點","e":"1. ANY BRIGHT SPOT LARGE OR SMALL - SERVICING REQUIRED"},{"s":520,"w":"SPRAY","p":"n","c":"噴灑","e":"1. KEEP THE NOZZLE OF THE SPRAY EQUIPMENT MORE THAN 12 IN. (305 MM) AWAY FROM THE SURFACE OF THE AIRPLANE. THE SPRAY CAN CAUSE DAMAGE TO THE SURFACE.\n2. Apply the corrosion resistant finish with a spray gun on the surface."},{"s":521,"w":"STABLE","p":"adj","c":"穩定的;平穩的","e":"1. MAKE SURE THAT THE PRESSURE INDICATIONS ARE STABLE.\n2. The five minutes is necessary for the IDG oil to become stable after engine is shutdown."},{"s":522,"w":"STAND","p":"n","c":"架子，座","e":"1. Remove the ground support and maintenance equipment, the special and standard tools and all other items.\n2. USE A LIFT CART OR STAND TO CLOSE INSPECT #11 KRUEGER FLAP OUTBOARD END COMPOSITE STRUCTURE AS SHOWN IN FIGURE 2 SHADOW AREAS FOR CRACK,DISBOND, BANDING MARK…ETC. DAMAGES."},{"s":523,"w":"STANDARD","p":"adj","c":"標準的","e":"1. REMOVE THE STANDARD AND THE SPECIAL TOOLS.\n2. Please do the standard procedures to remove the door seal."},{"s":524,"w":"STARTER","p":"n","c":"啟動器","e":"1. Examine the starter sight glass for dirt or unwanted material. If you cannot see through it, go to step B.\n2. Examine the starter oil level shown in the sight glass located at the 3'oclock position on the starter."},{"s":525,"w":"STEM","p":"n","c":"(工具的)炳，把，桿","e":"1. Remove the cap from the stem of the gas charging valve.\n2. Attach a source of nitrogen or dry air to the stem of the gas charging valve."},{"s":526,"w":"STIFF","p":"n","c":"剛性","e":"1. Remove the collected debris around the fixed PDUs with a stiff brush."},{"s":527,"w":"STOW","p":"v","c":"收回","e":"1. MAKE SURE THAT THE THRUST REVERSER STOWS WHEN YOU PUSH THE QUADRANT CONTROL FORWARD."},{"s":528,"w":"STRAIGHT","p":"adj","c":"直立的;挺直地","e":"1. MAKE SURE THAT THE STRAIGHT PART OF THE RIGGING PIN IS SMOOTH.\n2. Do not attempt to straighten bends in the cable."},{"s":529,"w":"STREAK","p":"n","c":"條紋","e":"1. Follow this with an up and down movement to remove the streaks."},{"s":530,"w":"STRIP","p":"n","c":"帶子","e":"1. \"ANY AMOUNT OF BLACK COLOR IN THE STRIP INDICATES A PROBLEM TEMPERATURE IN THE BRAKE & PDU SHOULD BE REMOVED FOR REPAIR AND/OR REPLACEMENT.\""},{"s":531,"w":"STRIPE","p":"n","c":"條紋;線條","e":"1. Twisting of the hose can be determined from the identification stripe running along its length.\n2. Use a continuous stripe of tape to wrap around the insulation/covering and the duct."},{"s":532,"w":"STROBE","p":"n","c":"閃光","e":"1. Do not let the strobe light flash dieectly in your eye."},{"s":533,"w":"STRUCTURE","p":"n","c":"結構;構造;組織","e":"1. Inspect the structure of the rear spar for cracks.\n2. If primer discoloration or other signs of heat damage are seen, do the eddy current test per NDT Manual to determine the extent of the structural damage."},{"s":534,"w":"SUBASSEMBLY","p":"n","c":"次組合件","e":"1. DO NOT CHANGE THE POSITION OF THE SUBASSEMBLIES."},{"s":535,"w":"SUBSEQUENT","p":"adj","c":"後來的","e":"1. DO THIS SERVICE BULLETIN ON AIRCRAFT MSN 123 AND SUBSEQUENT AIRCRAFT.\n2. Use BMS 3-32, Type I or Type II at the operator's discretion, for subsequent refills or to top off the strut. These two types of fluid are compatible."},{"s":536,"w":"SUBTRACT","p":"v","c":"減去;去掉","e":"1. SUBTRACT COEFFICIENT “A” FROM THE INDICATION."},{"s":537,"w":"SUDDEN","p":"adj","c":"突然的;意外的","e":"1. SUDDEN MOVEMENT CAN CAUSE DAMAGE TO THE LIMIT STOPS."},{"s":538,"w":"SUFFICIENT","p":"adj","c":"足夠的,充分的","e":"1. Set the pressure at 100 to 200 psi (689 - 1379 Kpa) unless otherwise specified. NOTE: This is usually sufficient to push out the used grease."},{"s":539,"w":"SUPERNUMERARY","p":"adj","c":"多餘的；過剩的；額外的"},{"s":540,"w":"SURGE","p":"v","c":"猛衝；激增；[電]浪湧","e":"1. In subsequent steps, the hydraulic pressure surge accumulator is referred to as the accumulator.\n2. PRESSURE CHECK BRAKE SURGE ACCUMULATOR PRECHARGE"},{"s":541,"w":"SURVEILLANCE","p":"n","c":"監視，監督，管制","e":"1. EXTERNAL SURVEILLANCE OF THE NOSE LANDING GEAR"},{"s":542,"w":"SUSPECTED","p":"adj","c":"被懷疑的;可能存在的","e":"1. Contamination of the oil is not suspected."},{"s":543,"w":"SWAB","p":"n","c":"醫用海綿；紗布；拖把","e":"1. APPLY THE CLEANER WITH SWABS OR BRUSHES."},{"s":544,"w":"SYMMETRICAL","p":"adj","c":"對稱的","e":"1. MAKE SURE THAT THE POSITION OF THE WING FLAPS IS SYMMETRICAL.\n2. When the control column pull back,the elevators must move symmetrically."},{"s":545,"w":"SYNCHRONIZED","p":"adj","c":"同步的","e":"1. MAKE SURE THAT THE TWO ROTORS ARE SYNCHRONIZED.\n2. Make sure the ball screw nuts are synchronized before you adjust the droop and symmetry. Make sure that dimension X is 0.54 to 0.90 inch (13.7 to 29 mm) for both of the ball screws."},{"s":546,"w":"SYNTHETIC","p":"adj","c":"合成的"},{"s":547,"w":"SYRINGE","p":"n","c":"注射器"},{"s":548,"w":"TACKY","p":"adj","c":"發黏的;(漆等)尚未乾透的","e":"1. WHEN THE COMPOUND IS TACKY, APPLY THE PATCH."},{"s":549,"w":"TAP","p":"v","c":"輕拍,輕叩","e":"1. TAP THE BOLT WITH A MALLET."},{"s":550,"w":"TAPE","p":"n","c":"帶子；膠布；捲尺","e":"1. CHECK CARGO LINING PANEL SEALING TAPE AT LINING FASTENERS, JOINTS, AND EDGES FOR CONDITION. REPLACE LOOSE, PEELED, OR DAMAGED SEALING TAPE WITH NEW TAPE, P/N P626 PER 747-400 AMM25-52-01, IF THE DEFECTIVE SEALING TAPE IS NOTED."},{"s":551,"w":"TASK","p":"n","c":"任務;工作","e":"1. This procedure is a scheduled maintenance task.\n2. THIS TASK IS CMR ITEM.THERE SHALL BE NO ESCALATION WITHOUT FAA APPROVAL."},{"s":552,"w":"TELESCOPIC","p":"adj","c":"望遠鏡的;可伸縮的"},{"s":553,"w":"TEMPORARILY","p":"adv","c":"暫時地,臨時地","e":"1. At a minimum, flexable hoses that have been temporarily repair must be replaced at the next \"A\" check or within 350 flight hours, whichever occurs later\n2. Make a record of the flexible hoses that you install as temporary repairs for rigid lines."},{"s":554,"w":"THICK","p":"adj","c":"厚厚地;密集地","e":"1. Some of the rigid cargo linings have a thick honeycomb core bonded between the sheets of the glass fabric laminations."},{"s":555,"w":"THIN","p":"adj","c":"薄;稀","e":"1. APPLY A THIN LAYER OF SEALING COMPOUND ON THE BARE METAL."},{"s":556,"w":"THRUST","p":"n","c":"推力;刺;插","e":"1. MAKE SURE THAT PERSONS AND EQUIPMENT ARE CLEAR OF ALL CONTROL SURFACES BEFORE YOU SUPPLY HYDRAULIC POWER. AILERONS, RUDDERS, ELEVATORS, FLAPS, SPOILERS, LANDING GEAR, AND THRUST REVERSERS CAN MOVE QUICKLY WHEN YOU SUPPLY HYDRAULIC POWER."},{"s":557,"w":"TIGHTEN","p":"v","c":"上緊,使繃緊","e":"1. Tighten the clamps. Examine the clamps and hoses for their condition and correct installation.\n2. Tighten fluid fittings gradually to the necessary torque value, back off 1/4 turn, then tightened again."},{"s":558,"w":"TILT","p":"v","c":"傾斜;翹起","e":"1. Do not tilt the hydraulic container to prevent leaking."},{"s":559,"w":"TIRE","p":"n","c":"輪胎；(車輪的)輪箍","e":"1. MAKE SURE THE TIRE PRESSURE AND RECORD TO DATA SHEET BEFORE YOU SERVICE TIRE.\n2. BEFORE YOU DO THE TOWING OR TAXIING PROCEDURES, MAKE SURE EACH AXLE HAS NO LESS THAN ONE TIRE CORRECTLY INFLATED. IF THE TIRE IS NOT CORRECTLY INFLATED, THE WHEEL FLANGES CAN TOUCH THE RUNWAY SURFACES WHEN THERE ARE SUDDEN STOPS OR STARTS."},{"s":560,"w":"TOGGLE","p":"n","c":"栓扣；[機]肘節；開關","e":"1. PLEASE PERFORM DETAIL INSPECTION OF L/H INBOARD FOREFLAP CENTER TOGGLE FITTING BEARING FOR ANY MIGRATION OR ABNORMAL CONDITION."},{"s":561,"w":"TOLERANCE","p":"n","c":"容許誤差","e":"1. When the permitted tolerances for the hold are incorrect, adjust the rod end to the standard.\n2. A larger torque wrench has a larger tolerance that causes more error."},{"s":562,"w":"TORQUE","p":"v","c":"上扭力","e":"1. Torque the nut to 120 pound-inches."},{"s":563,"w":"TOW","p":"v","c":"拖,拉;牽引","e":"1. TOW THE AIRCRAFT TO THE HANGAR.\n2. The ground speed should not more than 5 knots when towing the aircraft."},{"s":564,"w":"TRACK","p":"n","c":"軌道","e":"1. LUBRICATE LEFT BODY LANDING GEAR TRACK BEAM PIVOT BOLT."},{"s":565,"w":"TRAILING","p":"n","c":"後緣","e":"1. PERFORM RIGHT WING TRAILING EDGE FLAP SURFACE CLEANING."},{"s":566,"w":"TRANSDUCER","p":"n","c":"變換器.換能器"},{"s":567,"w":"TRANSMIT","p":"v","c":"傳送;發射","e":"1. TELL THE ATC TO MONITOR THE FREQUENCY WHEN YOU TRANSMIT.\n2. Monitor the level pointer and operate the hand-pump to transmit fluid to the reservoir."},{"s":568,"w":"TRANSPARENT","p":"adj","c":"透明的;清澈的","e":"1. PUT A TRANSPARENT SHEET OF PLASTIC ON THE SURFACE."},{"s":569,"w":"TRANSVERSE","p":"adj","c":"橫向的; 橫斷的; 橫切的","e":"1. Put the joystick in the IN or OUT position to extend the transverse drive wheel."},{"s":570,"w":"TRAVEL","p":"n","c":"經過;移動遊遍","e":"1. MAKE SURE THAT THE RANGE OF TRAVEL OF THE CONTROL SURFACES IS CLEAR.\n2. The turnbuckle travels through a hole in the bulkhead."},{"s":571,"w":"TRAY","p":"n","c":"盤子, 托盤","e":"1. Do a check of the roller trays, ball transfer panels, and sill rollers."},{"s":572,"w":"TREAD","p":"n","c":"(輪胎的)胎面","e":"1. Replace the solid drive-wheel tire if all the tread pattern is fully worn off. This includes the tread that extends not fully down the side of the tire."},{"s":573,"w":"TRUNNION","p":"n","c":"耳軸"},{"s":574,"w":"TURBINE","p":"n","c":"渦輪(機)","e":"1. CHECK THE STRUT 1 AIR DRIVEN PUMP OIL LEVEL. IF THE ORANGE SHAFT DOES NOT TOUCH THE FILLER CAP, YOU MUST ADD OIL (ETO-2380) TO THE TURBINE DRIVE."},{"s":575,"w":"TWIST","p":"v","c":"扭轉;扭彎","e":"1. Use the index line on the side of the hose to make sure the hose is not twisted.\n2. The ARINC 429 communication standard use twisted-pair wires to transmit the digital signals."},{"s":576,"w":"TYPICAL","p":"adj","c":"典型的,有代表性的","e":"1. THIS INSTALLATION PROCEDURE IS TYPICAL."},{"s":577,"w":"ULTRASONIC","p":"n","c":"超音波的; 超音速的","e":"1. PERFORM ULTRASONIC INSPECTION AFT BLEND OUT AREA MATERIAL THICKNESS."},{"s":578,"w":"UNFOLD","p":"v","c":"展開;呈現","e":"1. MAKE SURE THAT THE INDICATOR LIGHT COMES ON WHEN THE BLADES UNFOLD."},{"s":579,"w":"UNKNOWN","p":"adj","c":"不知道的;未知的","e":"1. DO NOT USE FUEL WITH UNKNOWN PROPERTIES."},{"s":580,"w":"UNLOCK","p":"v","c":"開;開啟","e":"1. MAKE SURE THAT THE CABIN PRESSURE DIFFERENTIAL IS ZERO BEFORE YOU UNLOCK THE DOOR."},
